<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17131f">
<meta name="description" content="Маленькая вселенная тёплых слов.">
<meta name="robots" content="noindex, nofollow">
<title>Маленькая вселенная</title>

<style>
  * { box-sizing: border-box; }

  :root {
    color-scheme: dark;
    --bg: #17131f;
    --ink: #faedf1;
    --muted: #c8b1c4;
    --accent: #eabbd5;
    --button-ink: #29182d;
    --line: #dab4d5;
    --wash: #a53e7540;
  }

  body[data-scene="velvet"] {
    color-scheme: dark;
    --bg: #21101c;
    --ink: #fff0f2;
    --muted: #d8b0c1;
    --accent: #efabc5;
    --button-ink: #321426;
    --line: #eda4c2;
    --wash: #c12e6552;
  }

  body[data-scene="diamond"] {
    color-scheme: dark;
    --bg: #102432;
    --ink: #effbff;
    --muted: #b5cddc;
    --accent: #afe5f4;
    --button-ink: #143041;
    --line: #afeaff;
    --wash: #389cc344;
  }

  body[data-scene="pink"] {
    color-scheme: light;
    --bg: #f7dce7;
    --ink: #651e44;
    --muted: #814360;
    --accent: #902b59;
    --button-ink: #fff3f8;
    --line: #9f3565;
    --wash: #e5478a38;
  }

  body[data-scene="violet"] {
    color-scheme: dark;
    --bg: #281740;
    --ink: #f5ecff;
    --muted: #cebce1;
    --accent: #d8bcff;
    --button-ink: #301c4c;
    --line: #d8bbff;
    --wash: #a569d54d;
  }

  body[data-scene="gold"] {
    color-scheme: light;
    --bg: #faf0dc;
    --ink: #57361f;
    --muted: #7c583c;
    --accent: #875324;
    --button-ink: #fff5e5;
    --line: #97602b;
    --wash: #e7aa4144;
  }

  body[data-scene="night"] {
    color-scheme: dark;
    --bg: #101725;
    --ink: #f3edf9;
    --muted: #b6b9d2;
    --accent: #d6c7ee;
    --button-ink: #211b36;
    --line: #d1c5f0;
    --wash: #7162ae30;
  }

  html {
    min-height: 100%;
    background: #17131f;
  }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 36px 23px;
    padding-top: max(36px, env(safe-area-inset-top));
    padding-bottom: max(36px, env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
    isolation: isolate;
    transition: background-color 1300ms ease, color 800ms ease;
  }

  .background, .texture, .sky, .effects {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }

  .background {
    background:
      radial-gradient(ellipse at 10% 15%, var(--wash), transparent 54%),
      radial-gradient(ellipse at 95% 85%, var(--wash), transparent 50%);
  }

  .texture {
    opacity: .12;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 150 150' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath d='M0 0h150v150H0z' fill='%23888' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E");
  }

  /* Небо распределено по краям; центр оставляем словам. */
  .sky {
    width: 100%;
    height: 100%;
    color: var(--line);
    opacity: .65;
    transition: color 1s ease, opacity 1s ease;
  }

  body[data-mode="cover"] .sky { opacity: .2; }
  body[data-mode="final"] .sky { opacity: 1; }

  .star, .star-halo, .star-link {
    opacity: 0;
    transition: opacity 1100ms ease;
  }

  .star.visible { opacity: .88; }
  .star-halo.visible { opacity: .12; }
  .star-link.visible { opacity: .3; }

  .star {
    fill: currentColor;
  }

  .star-halo {
    fill: currentColor;
  }

  .star-link {
    stroke: currentColor;
    stroke-width: .65;
    fill: none;
    vector-effect: non-scaling-stroke;
  }

  body[data-mode="final"] .star-link.visible { opacity: .55; }

  .motif {
    position: absolute;
    color: var(--line);
    opacity: 0;
    transition: opacity 1100ms ease, transform 1600ms ease;
  }

  .halo {
    width: min(90vw, 600px);
    aspect-ratio: 1;
    border: 1px solid currentColor;
    border-radius: 50%;
    left: -35%;
    top: 19%;
    box-shadow: inset 0 0 80px var(--wash), 0 0 80px var(--wash);
    transform: scale(.8);
  }

  [data-scene="velvet"] .halo {
    opacity: .23;
    transform: scale(1);
  }

  .diamond {
    width: 270px;
    height: 340px;
    border: 1px solid currentColor;
    right: -165px;
    top: 16%;
    transform: rotate(25deg);
  }

  .diamond::after {
    content: "";
    position: absolute;
    inset: 28px;
    border: 1px solid currentColor;
  }

  [data-scene="diamond"] .diamond {
    opacity: .24;
    transform: rotate(40deg);
  }

  .flower {
    width: 280px;
    height: 280px;
    left: -160px;
    bottom: 10%;
    transform: rotate(-20deg);
  }

  [data-scene="pink"] .flower {
    opacity: .23;
    transform: rotate(10deg);
  }

  .orbit {
    width: min(115vw, 750px);
    height: 240px;
    border: 1px solid currentColor;
    border-radius: 50%;
    left: -48%;
    top: 24%;
    transform: rotate(-35deg);
  }

  .orbit::after {
    content: "";
    position: absolute;
    inset: 25px -15px;
    border: 1px solid currentColor;
    border-radius: 50%;
    transform: rotate(25deg);
  }

  [data-scene="violet"] .orbit {
    opacity: .24;
    transform: rotate(-23deg);
  }

  .sun {
    width: 220px;
    height: 220px;
    border: 1px solid currentColor;
    border-radius: 50%;
    right: -130px;
    top: 10%;
    transform: translateY(30px);
    background: radial-gradient(circle, var(--wash), transparent 70%);
  }

  .sun::after {
    content: "";
    position: absolute;
    left: -90px;
    right: -90px;
    top: 55%;
    height: 1px;
    background: currentColor;
  }

  [data-scene="gold"] .sun {
    opacity: .3;
    transform: translateY(0);
  }

  .light-pass {
    position: absolute;
    inset: -40%;
    opacity: 0;
    background: linear-gradient(
      110deg, transparent 35%, var(--wash) 50%, transparent 65%
    );
  }

  .effects.play .light-pass {
    animation: light-pass 1500ms ease both;
  }

  /* Кольца — тихое визуальное эхо удара по тарелке. */
  .resonance {
    position: absolute;
    width: 110px;
    height: 110px;
    left: -35px;
    top: 36%;
    border: 1px solid var(--line);
    border-radius: 50%;
    opacity: 0;
  }

  .effects.drum .resonance {
    animation: resonance 1700ms ease-out both;
  }

  .effects.drum .resonance:nth-of-type(2) {
    animation-delay: 180ms;
  }

  .effects.drum .resonance:nth-of-type(3) {
    animation-delay: 360ms;
  }

  main {
    position: relative;
    z-index: 1;
    width: min(100%, 590px);
    text-align: center;
    animation: arrive 900ms ease both;
  }

  .brand {
    margin: 0 0 24px;
    color: var(--muted);
    font: 500 10px/1.8 system-ui, sans-serif;
    letter-spacing: .26em;
    text-transform: uppercase;
  }

  .stage {
    min-height: 350px;
    display: grid;
    align-content: center;
    padding: 30px 12px;
    opacity: 1;
    transform: translateY(0);
    transition: opacity 350ms ease, transform 450ms ease;
  }

  .stage.hidden {
    opacity: 0;
    transform: translateY(9px);
  }

  .stage.cover {
    padding: 0;
    min-height: 0;
  }

  .stage.cover.hidden {
    transform: scale(1.035);
  }

  .album {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    width: min(100%, 410px);
    min-height: 435px;
    margin: 0 auto;
    padding: 37px 24px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 1px solid #dfafce40;
    border-radius: 5px;
    background:
      radial-gradient(ellipse at 90% 0%, #a9447755, transparent 60%),
      linear-gradient(145deg, #342238, #161522 80%);
    box-shadow: 0 25px 75px #00000030;
  }

  .album::after {
    content: "";
    position: absolute;
    inset: 9px;
    border: 1px solid #f8d8ed13;
    pointer-events: none;
  }

  .record {
    position: absolute;
    z-index: -1;
    width: 330px;
    height: 330px;
    right: -140px;
    top: -115px;
    border-radius: 50%;
    opacity: .45;
    background: repeating-radial-gradient(
      circle,
      transparent 0 10px,
      #e5b7d329 11px,
      transparent 12px 18px
    );
  }

  .album-star {
    margin-bottom: 28px;
    font-size: 33px;
    color: #edc9e3;
    animation: breathe 6s ease-in-out infinite;
  }

  .album-label {
    margin: 0 0 21px;
    color: #cfadc6;
    font: 10px/1.7 system-ui, sans-serif;
    letter-spacing: .22em;
    text-transform: uppercase;
  }

  .album h1 {
    margin: 0;
    color: #fff0f3;
    font-weight: normal;
    font-size: clamp(30px, 7vw, 42px);
    line-height: 1.15;
  }

  .album-copy {
    margin: 22px 0 0;
    color: #e2c9d9;
    font-size: 18px;
    line-height: 1.7;
    text-wrap: balance;
  }

  .album-bottom {
    margin: 29px 0 0;
    color: #c4a5bc;
    font: 9px/1.8 system-ui, sans-serif;
    letter-spacing: .14em;
    text-transform: uppercase;
  }

  .label {
    margin: 0 0 28px;
    color: var(--muted);
    font: 10px/1.8 system-ui, sans-serif;
    letter-spacing: .2em;
    text-transform: uppercase;
  }

  .message {
    margin: 0;
    font-size: clamp(25px, 5.6vw, 37px);
    font-weight: normal;
    line-height: 1.47;
    text-wrap: pretty;
    overflow-wrap: break-word;
  }

  .message em {
    font-weight: normal;
    color: var(--accent);
  }

  .stage.note .message {
    font-size: clamp(24px, 5.2vw, 34px);
    font-style: italic;
  }

  .final-title {
    margin: 0 0 25px;
    font-size: clamp(36px, 8vw, 52px);
    font-weight: normal;
    line-height: 1.16;
    text-wrap: balance;
  }

  .final-copy {
    margin: 0 auto 19px;
    max-width: 390px;
    font-size: 18px;
    line-height: 1.75;
    text-wrap: pretty;
  }

  .final-copy.muted {
    color: var(--muted);
    font-size: 15px;
  }

  .button-wrap {
    position: relative;
    width: fit-content;
    max-width: 100%;
    margin: 25px auto 0;
  }

  .button-wrap::before {
    content: "";
    position: absolute;
    inset: -8px;
    border: 1px solid var(--line);
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
  }

  .button-wrap.pulse::before {
    animation: ring 1100ms ease-out both;
  }

  button {
    display: block;
    max-width: 100%;
    min-height: 55px;
    padding: 17px 25px;
    border: 1px solid transparent;
    border-radius: 999px;
    background: var(--accent);
    color: var(--button-ink);
    font: 500 13px/1.5 system-ui, sans-serif;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition:
      background-color 900ms ease,
      color 900ms ease,
      transform 180ms ease;
  }

  button:active { transform: scale(.98); }

  button:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 6px;
  }

  button[aria-disabled="true"] { cursor: wait; }

  @media (hover: hover) {
    button:hover { transform: translateY(-2px); }
  }

  footer {
    min-height: 23px;
    margin-top: 27px;
    color: var(--muted);
    font: 11px/1.9 system-ui, sans-serif;
    text-wrap: balance;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  @keyframes arrive {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes breathe {
    0%, 100% { opacity: .55; transform: scale(.95); }
    50% { opacity: 1; transform: scale(1.07); }
  }

  @keyframes light-pass {
    0% { opacity: 0; transform: translateX(-35%); }
    45% { opacity: .65; }
    100% { opacity: 0; transform: translateX(35%); }
  }

  @keyframes resonance {
    0% { opacity: 0; transform: scale(.4); }
    20% { opacity: .3; }
    100% { opacity: 0; transform: scale(3.3); }
  }

  @keyframes ring {
    0% { opacity: 0; transform: scale(.98); }
    25% { opacity: .35; }
    100% { opacity: 0; transform: scale(1.2, 1.6); }
  }

  @media (max-width: 370px) {
    body { padding-left: 18px; padding-right: 18px; }
    .album { padding: 32px 18px; min-height: 410px; }
    .stage:not(.cover) { padding-left: 9px; padding-right: 9px; }
  }

  body.paused *,
  body.paused *::before,
  body.paused *::after {
    animation-play-state: paused !important;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>

<body data-scene="intro" data-mode="cover">
<div class="background" aria-hidden="true"></div>
<div class="texture" aria-hidden="true"></div>

<svg class="sky" id="sky" viewBox="0 0 100 100"
     preserveAspectRatio="none" aria-hidden="true">
  <g id="sky-links"></g>
  <g id="sky-stars"></g>
</svg>

<div class="effects" id="effects" aria-hidden="true">
  <div class="motif halo"></div>
  <div class="motif diamond"></div>

  <svg class="motif flower" viewBox="0 0 300 300"
       fill="none" stroke="currentColor" stroke-width="1">
    <ellipse cx="150" cy="150" rx="43" ry="120"/>
    <ellipse cx="150" cy="150" rx="43" ry="120"
             transform="rotate(60 150 150)"/>
    <ellipse cx="150" cy="150" rx="43" ry="120"
             transform="rotate(120 150 150)"/>
    <circle cx="150" cy="150" r="20"/>
  </svg>

  <div class="motif orbit"></div>
  <div class="motif sun"></div>
  <div class="light-pass"></div>

  <section>
    <i class="resonance"></i>
    <i class="resonance"></i>
    <i class="resonance"></i>
  </section>
</div>

<main>
  <p class="brand" id="brand">маленькая вселенная · личное издание</p>

  <section class="stage cover" id="stage" aria-label="Послание">
    <div class="album">
      <div class="record" aria-hidden="true"></div>
      <div class="album-star" aria-hidden="true">✧</div>
      <p class="album-label">посвящается тебе</p>

      <h1>Василиса<br>Романовна</h1>

      <p class="album-copy">
        Если бы тёплые слова<br>
        могли стать альбомом,<br>
        этот был бы посвящён тебе.
      </p>

      <p class="album-bottom">
        мягкость внутри · электричество снаружи
      </p>
    </div>
  </section>

  <div class="button-wrap" id="button-wrap">
    <button type="button" id="button">
      Открыть маленькую вселенную
    </button>
  </div>

  <footer id="footer">здесь звучат слова, не музыка</footer>

  <p class="sr-only" id="announcement"
     aria-live="polite" aria-atomic="true"></p>

  <noscript>
    <p>Чтобы открыть послание, включи JavaScript в браузере.</p>
  </noscript>
</main>

<script>
  // Звёздочки вокруг слова означают выделение курсивом.
  // Музыкальные фразы — собственные метафоры,
  // а не цитаты из текстов песен.

  const gentle = [
    ["В тебе есть *свет*, который не просит внимания, но делает всё вокруг немного прекраснее.", "gold"],
    ["Ты — как строчка в любимой книге: её знаешь наизусть, но всё равно перечитываешь с улыбкой.", "pink"],
    ["Твоя улыбка — маленькая *весна*, которой не нужно сверяться с календарём.", "gold"],
    ["В тебе есть редкое очарование: рядом с тобой даже обычный день кажется неслучайным.", "velvet"],
    ["Если бы нежность можно было нарисовать, художнику всё равно пришлось бы искать вдохновение в тебе.", "pink"],
    ["У твоего очарования явно нет привычки предупреждать о своём появлении.", "velvet"],
    ["Тебе не нужно быть ярче всех. У твоего света есть то, чего не повторит ни одна звезда.", "diamond"],
    ["В тебе прекрасно не только сияние, но и *глубина*, из которой оно рождается.", "violet"],
    ["Если бы звёзды коллекционировали земные чудеса, твоя улыбка занимала бы отдельное созвездие.", "diamond"],
    ["Ты не украшение чужой истории. Ты — целое *небо* со своими созвездиями.", "violet"],
    ["Твой смех мог бы быть уважительной причиной, чтобы ненадолго остановить время.", "gold"],
    ["Тебе удивительно идёт быть собой. Ни одному образу не сравниться с оригиналом.", "pink"],
    ["У тебя есть собственная гравитация. Иначе почему мысли так легко возвращаются к тебе?", "violet"],
    ["Твоя красота не требует восклицательных знаков. Иногда от восхищения просто становится *тихо*.", "velvet"],
    ["Ты могла бы быть музой. Но быть собой у тебя получается гораздо интереснее.", "violet"],
    ["Миру очень идёт твоё присутствие.", "gold"],
    ["Некоторые мгновения хочется сохранить между страницами, как цветы. Твоя улыбка — одно из них.", "pink"],
    ["Ты прекрасна не как что-то. Ты прекрасна так, что хочется придумывать новые сравнения.", "velvet"],
    ["Твоя нежность — не хрупкость. Это *сила*, которая умеет обходиться без шума.", "pink"],
    ["Есть свет, от которого щурятся. А есть твой — к нему хочется повернуться.", "gold"],
    ["Тебе не нужен идеальный день, чтобы быть прекрасной его частью.", "gold"],
    ["Есть красота, которую замечают. Твою — уносят с собой в памяти.", "velvet"],
    ["Ты похожа на хорошую новость, которую хочется перечитать ещё раз.", "pink"],
    ["В тебе есть что-то от тихого звёздного вечера: хочется отложить все дела и просто любоваться.", "diamond"]
  ];

  const drums = [
    ["В твоих руках ритм становится не просто счётом, а способом сказать что-то прекрасное *без единого слова*.", "diamond"],
    ["Ты не просто держишь ритм. Ты даёшь музыке *пульс*.", "velvet"],
    ["За каждым движением, которое однажды станет лёгким, стоят твои старания. И ими уже можно гордиться.", "gold"],
    ["Пусть сейчас получается не всё. Это не отменяет ни твоего таланта, ни дороги, которую ты уже прошла.", "pink"],
    ["Иногда *мечта* звучит не как тихое желание, а как четыре удара палочками перед началом.", "violet"],
    ["Ты большая молодец. Не только когда всё звучит идеально — но и когда пробуешь *ещё раз*.", "gold"],
    ["Тебе очень идёт создавать музыку: превращать движение в звук, а звук — в чьё-то настроение.", "pink"],
    ["Даже самому сложному рисунку можно дать время. Тебе не нужно уметь всё сегодня, чтобы однажды сыграть его свободно.", "diamond"],
    ["Хочется, чтобы однажды ты вышла на сцену, о которой мечтаешь, и подумала: «Как хорошо, что я тогда не остановилась».", "violet"],
    ["У твоей мечты уже есть пульс. Ты сама задаёшь его каждым новым занятием.", "velvet"],
    ["Ты красиво играешь. Не только потому, что попадаешь в ритм, — в этой музыке есть *ты*.", "pink"],
    ["Один трудный день за установкой не определяет, какая ты музыкантка. У твоей истории гораздо больше тактов.", "diamond"]
  ];

  const music = [
    ["Твои глаза красивее, чем обещает название *Diamond Eyes*.", "diamond"],
    ["Если бы у этой нежности был саундтрек, сейчас играла бы *Sextape*.", "violet"],
    ["В тебе есть что-то от *Beauty School*: хочется поставить весь остальной мир на паузу.", "pink"],
    ["*Be Quiet and Drive* — а можно просто помолчать рядом с тобой, и никуда не ехать?", "velvet"],
    ["Если бы *Cherry Waves* были цветом, ими можно было бы нарисовать этот вечер. Но для твоей улыбки всё равно понадобился бы свет.", "velvet"],
    ["Твоя улыбка — любимый неожиданный переход от тяжёлых гитар к чему-то невероятно *нежному*.", "gold"],
    ["Некоторые песни хочется слушать на повторе. А некоторые мгновения с тобой — проживать ещё раз.", "violet"],
    ["В твоём плейлисте — *Deftones*. А в твоих руках — возможность однажды создать чей-то любимый момент в музыке.", "diamond"]
  ];

  const note = {
    id: "note",
    kind: "note",
    scene: "velvet",
    text: "Музыкальные отсылки здесь не случайны. Хотелось, чтобы ты узнала в этом маленьком мире что-то *своё*."
  };

  const catalog = [
    ...gentle.map(([text, scene], i) => ({
      id: `g${i}`, kind: "gentle", text, scene
    })),
    ...drums.map(([text, scene], i) => ({
      id: `d${i}`, kind: "drum", text, scene
    })),
    ...music.map(([text, scene], i) => ({
      id: `m${i}`, kind: "music", text, scene
    })),
    note
  ];

  const byId = new Map(catalog.map(item => [item.id, item]));

  const scenes = {
    intro:   { name: "", color: "#17131f" },
    velvet:  { name: "бархатная ночь", color: "#21101c" },
    diamond: { name: "алмазный свет", color: "#102432" },
    pink:    { name: "розовая плёнка", color: "#f7dce7" },
    violet:  { name: "фиалковый сон", color: "#281740" },
    gold:    { name: "золотой час", color: "#faf0dc" },
    night:   { name: "ближе к звёздам", color: "#101725" }
  };

  const footnotes = [
    "у нежности нет обязательного повода",
    "одна фраза — ещё одна звезда",
    "мягкость тоже умеет звучать громко",
    "это место никуда не торопится",
    "маленькие чудеса тоже считаются"
  ];

  const stage = document.getElementById("stage");
  const button = document.getElementById("button");
  const buttonWrap = document.getElementById("button-wrap");
  const effects = document.getElementById("effects");
  const brand = document.getElementById("brand");
  const footer = document.getElementById("footer");
  const announcement = document.getElementById("announcement");
  const themeMeta = document.querySelector('meta[name="theme-color"]');
  const motion = window.matchMedia("(prefers-reduced-motion: reduce)");

  const storageKey = "little-universe-finite-v5";
  let mode = "cover";
  let busy = false;
  let effectTimer;

  function shuffle(values) {
    const result = [...values];

    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }

    return result;
  }

  function makeState() {
    const g = shuffle(catalog.filter(x => x.kind === "gentle"));
    const d = shuffle(catalog.filter(x => x.kind === "drum"));
    const m = shuffle(catalog.filter(x => x.kind === "music"));

    // Начинаем со светлой сцены.
    const openingIndex = g.findIndex(x => x.scene === "gold");
    const opening = g.splice(openingIndex, 1)[0];
    const deck = [opening.id];

    // Смешиваем нежные и барабанные фразы, не собирая
    // все комплименты одного типа в один длинный блок.
    const base = [];

    while (g.length || d.length) {
      if (g.length) base.push(g.pop());
      if (d.length) base.push(d.pop());
      if (g.length) base.push(g.pop());
    }

    let sinceMusic = 1;

    for (const item of base) {
      deck.push(item.id);
      sinceMusic++;

      if (sinceMusic >= 5 && m.length) {
        deck.push(m.pop().id);
        sinceMusic = 0;
      }
    }

    while (m.length) deck.push(m.pop().id);

    // Одна особенная записка после первых музыкальных отсылок.
    deck.splice(12, 0, note.id);

    return { deck, seen: 0, finished: false };
  }

  function validState(value) {
    return value &&
      Array.isArray(value.deck) &&
      value.deck.length === catalog.length &&
      new Set(value.deck).size === catalog.length &&
      value.deck.every(id => byId.has(id)) &&
      Number.isInteger(value.seen) &&
      value.seen >= 0 &&
      value.seen <= value.deck.length &&
      typeof value.finished === "boolean" &&
      (!value.finished || value.seen === value.deck.length);
  }

  let state;

  try {
    const saved = JSON.parse(localStorage.getItem(storageKey));
    state = validState(saved) ? saved : makeState();
  } catch {
    state = makeState();
  }

  function save() {
    try {
      localStorage.setItem(storageKey, JSON.stringify(state));
    } catch {
      // При недоступном хранилище всё работает,
      // но прогресс сохраняется только до закрытия страницы.
    }
  }

  save();

  // Восемь авторских созвездий: верх, низ и боковые края.
  // 48 уникальных точек — достаточно для текущих 45 посланий.
  const groups = [
    [[6,8],[15,5],[23,10],[32,6],[40,12],[47,7]],
    [[57,7],[64,12],[73,6],[81,10],[89,5],[96,12]],
    [[4,22],[10,28],[5,35],[12,41],[6,48],[11,54]],
    [[95,23],[89,29],[96,36],[90,42],[96,49],[90,55]],
    [[5,61],[11,66],[4,72],[10,77],[5,83],[13,87]],
    [[95,62],[89,67],[96,73],[90,78],[96,84],[88,88]],
    [[8,94],[19,90],[27,96],[35,91],[42,97],[48,92]],
    [[56,94],[64,89],[72,96],[80,91],[87,97],[96,93]]
  ];

  const svgNS = "http://www.w3.org/2000/svg";
  const starLayer = document.getElementById("sky-stars");
  const linkLayer = document.getElementById("sky-links");
  const stars = [];
  const links = [];
  const previousPoint = new Map();

  // Чередуем группы: небо растёт сразу с разных сторон.
  for (let step = 0; step < 6; step++) {
    for (let group = 0; group < groups.length; group++) {
      if (stars.length >= catalog.length) break;

      const [x, y] = groups[group][step];
      const index = stars.length;

      const halo = document.createElementNS(svgNS, "ellipse");
      halo.setAttribute("cx", x);
      halo.setAttribute("cy", y);
      halo.setAttribute("rx", ".95");
      halo.setAttribute("ry", ".52");
      halo.classList.add("star-halo");

      const star = document.createElementNS(svgNS, "ellipse");
      star.setAttribute("cx", x);
      star.setAttribute("cy", y);
      star.setAttribute("rx", ".32");
      star.setAttribute("ry", ".18");
      star.classList.add("star");

      starLayer.append(halo, star);
      stars.push({ star, halo });

      if (previousPoint.has(group)) {
        const previous = previousPoint.get(group);
        const line = document.createElementNS(svgNS, "line");

        line.setAttribute("x1", previous.x);
        line.setAttribute("y1", previous.y);
        line.setAttribute("x2", x);
        line.setAttribute("y2", y);
        line.classList.add("star-link");

        linkLayer.append(line);
        links.push({ element: line, appearsAt: index + 1 });
      }

      previousPoint.set(group, { x, y });
    }
  }

  function updateSky() {
    stars.forEach(({ star, halo }, i) => {
      star.classList.toggle("visible", i < state.seen);
      halo.classList.toggle("visible", i < state.seen);
    });

    links.forEach(({ element, appearsAt }) => {
      element.classList.toggle("visible", state.seen >= appearsAt);
    });
  }

  function setScene(name) {
    document.body.dataset.scene = name;
    themeMeta.content = scenes[name].color;
  }

  function element(tag, className, text) {
    const node = document.createElement(tag);
    node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function addFormattedText(node, text) {
    // Без вставки HTML: только текст и безопасные элементы <em>.
    text.split("*").forEach((part, i) => {
      if (i % 2 === 1) {
        node.append(element("em", "", part));
      } else {
        node.append(document.createTextNode(part));
      }
    });
  }

  function plainText(text) {
    return text.replace(/\*/g, "");
  }

  function renderCard() {
    mode = "reading";
    document.body.dataset.mode = mode;

    const item = byId.get(state.deck[state.seen - 1]);
    const remaining = state.deck.length - state.seen;

    // В конце движение цвета успокаивается.
    const scene = remaining < 3 ? "night" : item.scene;

    setScene(scene);
    stage.classList.remove("cover", "final");
    stage.classList.toggle("note", item.kind === "note");

    const labelText = item.kind === "note"
      ? "сторона B · между строк"
      : item.kind === "drum"
        ? "твоей мечте есть куда звучать"
        : item.kind === "music"
          ? "маленькая отсылка к твоему плейлисту"
          : scenes[scene].name;

    const heading = element("h1", "sr-only", "Тёплые слова");
    const label = element("p", "label", labelText);
    const message = element("p", "message");

    addFormattedText(message, item.text);
    stage.replaceChildren(heading, label, message);

    brand.textContent = "маленькая вселенная · для тебя";

    button.textContent = remaining === 0
      ? "Посмотреть, что получилось"
      : item.kind === "note"
        ? "Читать дальше"
        : "Ещё немного магии";

    footer.textContent = remaining === 0
      ? "последняя звезда уже на своём месте"
      : footnotes[Math.floor((state.seen - 1) / 4) % footnotes.length];

    announcement.textContent = plainText(item.text);
    updateSky();

    return item.kind;
  }

  function renderFinal() {
    mode = "final";
    document.body.dataset.mode = mode;
    setScene("night");

    stage.classList.remove("cover", "note");
    stage.classList.add("final");
    stage.style.minHeight = "";

    const label = element("p", "label", "последний трек · послесвечение");
    const title = element("h1", "final-title", "Вот и целое небо.");

    const first = element(
      "p", "final-copy",
      "Пока ты читала, здесь появлялись звёзды. По одной на каждое послание — теперь они все на своём месте."
    );

    const second = element(
      "p", "final-copy",
      "На сегодня тёплые слова закончились. Но всё хорошее, что здесь было сказано, не заканчивается вместе с ними."
    );

    const wish = element(
      "p", "final-copy",
      "Пусть у тебя будет больше музыки, смелости и моментов, когда ты гордишься собой."
    );

    const hint = element(
      "p", "final-copy muted",
      "Если захочешь пройти этот маленький путь ещё раз — просто нажми кнопку ниже."
    );

    stage.replaceChildren(label, title, first, second, wish, hint);

    brand.textContent = "маленькая вселенная · собрана тобой";
    button.textContent = "Собрать небо заново";
    footer.textContent = "у этой истории есть финал. у нежности — нет.";

    announcement.textContent = [
      title.textContent,
      first.textContent,
      second.textContent,
      wish.textContent,
      hint.textContent
    ].join(" ");

    updateSky();
  }

  function animateScene(kind) {
    if (motion.matches || mode === "final") return;

    clearTimeout(effectTimer);
    effects.classList.remove("play", "drum");
    buttonWrap.classList.remove("pulse");

    void effects.offsetWidth;

    effects.classList.add("play");
    if (kind === "drum") effects.classList.add("drum");
    buttonWrap.classList.add("pulse");

    effectTimer = setTimeout(() => {
      effects.classList.remove("play", "drum");
      buttonWrap.classList.remove("pulse");
    }, 2200);
  }

  // На обложке предлагаем продолжить, если уже были прочитаны слова.
  if (state.finished) {
    button.textContent = "Вернуться к собранному небу";
    footer.textContent = "твоё небо осталось здесь";
  } else if (state.seen > 0) {
    button.textContent = "Продолжить маленькую вселенную";
    footer.textContent = "мы остановились там, где осталась твоя звезда";
  }

  updateSky();

  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  button.addEventListener("click", async () => {
    if (busy) return;

    busy = true;
    button.setAttribute("aria-disabled", "true");

    try {
      const delay = motion.matches ? 0 : 370;
      const previousMode = mode;

      if (mode === "reading") {
        stage.style.minHeight =
          `${stage.getBoundingClientRect().height}px`;
      }

      stage.classList.add("hidden");
      await wait(delay);

      let kind = "";

      if (mode === "cover") {
        if (state.finished) {
          renderFinal();
        } else {
          // Возвращение показывает последнюю открытую фразу,
          // не пропуская её и не добавляя лишнюю звезду.
          if (state.seen === 0) state.seen = 1;
          kind = renderCard();
        }
      } else if (mode === "final") {
        state = makeState();
        state.seen = 1;
        stage.style.minHeight = "";
        kind = renderCard();
      } else if (state.seen < state.deck.length) {
        state.seen++;
        kind = renderCard();
      } else {
        state.finished = true;
        renderFinal();
      }

      save();

      if (mode === "reading") {
        stage.style.minHeight =
          `${stage.getBoundingClientRect().height}px`;
      }

      stage.classList.remove("hidden");
      animateScene(kind);

      // После высокой финальной страницы начало нового
      // прохода возвращается к верхней части сайта.
      if (previousMode === "final") {
        window.scrollTo({ top: 0, behavior: "auto" });
      }

      await wait(delay);
    } finally {
      stage.classList.remove("hidden");
      button.removeAttribute("aria-disabled");
      busy = false;
    }
  });

  let resizeTimer;

  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (!busy) stage.style.minHeight = "";
    }, 200);
  });

  function updateVisibility() {
    document.body.classList.toggle("paused", document.hidden);
  }

  document.addEventListener("visibilitychange", updateVisibility);
  updateVisibility();
</script>
</body>
</html>

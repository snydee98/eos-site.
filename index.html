<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#faf6f0"
        media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191923"
        media="(prefers-color-scheme: dark)">

  <meta name="description"
        content="Одно маленькое послание. И немного света.">
  <meta name="robots" content="noindex, nofollow">

  <title>Одно маленькое послание</title>

  <style>
    :root {
      color-scheme: light;

      --bg: #faf6f0;
      --ink: #574039;
      --muted: #80695f;
      --accent: #805443;
      --button-text: #fffaf5;
      --line: #bb9475;
      --card: rgba(255, 252, 247, .85);
      --border: rgba(128, 84, 67, .18);
      --shadow: rgba(111, 76, 57, .09);
      --grain: rgba(87, 64, 57, .045);
      --spark: #b7834c;

      --peach: rgba(239, 179, 133, .32);
      --rose: rgba(228, 157, 175, .25);
      --lilac: rgba(179, 162, 215, .28);
      --honey: rgba(231, 193, 104, .28);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;

        --bg: #191923;
        --ink: #f1e4da;
        --muted: #beaaa0;
        --accent: #dfbaa1;
        --button-text: #28202a;
        --line: #be977c;
        --card: rgba(40, 32, 43, .88);
        --border: rgba(223, 186, 161, .19);
        --shadow: rgba(0, 0, 0, .2);
        --grain: rgba(255, 240, 225, .035);
        --spark: #e5c29f;

        --peach: rgba(174, 105, 81, .24);
        --rose: rgba(170, 84, 125, .23);
        --lilac: rgba(116, 101, 173, .28);
        --honey: rgba(169, 135, 62, .2);
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      padding-top: max(32px, env(safe-area-inset-top));
      padding-bottom: max(32px, env(safe-area-inset-bottom));
      color: var(--ink);
      background: var(--bg);
      font-family: Georgia, "Times New Roman", serif;
      -webkit-font-smoothing: antialiased;
      isolation: isolate;
    }

    /* Декорации не перехватывают нажатия. */
    .atmosphere,
    .grain,
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .atmosphere {
      z-index: -3;
    }

    .aura {
      position: absolute;
      inset: -10%;
      opacity: 0;
      transition: opacity 1600ms ease;
      background:
        radial-gradient(
          ellipse at 50% 30%,
          var(--tint), transparent 58%
        ),
        radial-gradient(
          ellipse at 80% 85%,
          var(--tint), transparent 48%
        );
    }

    .aura.active {
      opacity: 1;
    }

    .aura[data-tone="peach"] { --tint: var(--peach); }
    .aura[data-tone="rose"]  { --tint: var(--rose); }
    .aura[data-tone="lilac"] { --tint: var(--lilac); }
    .aura[data-tone="honey"] { --tint: var(--honey); }

    .grain {
      z-index: -2;
      opacity: .6;
      background-image:
        radial-gradient(var(--grain) .6px, transparent .9px),
        radial-gradient(var(--grain) .5px, transparent .8px);
      background-size: 5px 7px, 9px 11px;
      background-position: 0 0, 3px 4px;
    }

    .particles {
      z-index: -1;
    }

    .particle {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: var(--spark);
      box-shadow: 0 0 10px var(--spark);
      opacity: 0;
      animation: drift var(--duration) ease-in-out infinite;
      animation-delay: var(--delay);
    }

    main {
      width: min(100%, 650px);
      text-align: center;
      animation: arrive 900ms ease both;
    }

    .brand {
      margin: 0 0 27px;
      color: var(--muted);
      font: 500 10px/1.7 system-ui, sans-serif;
      letter-spacing: .32em;
      text-transform: uppercase;
    }

    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 380px;
      padding: 35px 20px;
      opacity: 1;
      transform: translateY(0);
      transition:
        opacity 350ms ease,
        transform 350ms ease;
    }

    .stage.is-hidden {
      opacity: 0;
      transform: translateY(9px);
    }

    /* Бумажная обложка существует только у приветствия. */
    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border: 1px solid var(--border);
      border-radius: 5px 5px 30px 5px;
      background: var(--card);
      box-shadow:
        0 18px 65px var(--shadow),
        inset 0 0 0 7px var(--bg);
      opacity: 0;
    }

    .stage.welcome::before {
      opacity: 1;
    }

    .eyebrow {
      margin: 0 0 24px;
      color: var(--muted);
      font: 11px/1.7 system-ui, sans-serif;
      letter-spacing: .13em;
    }

    .welcome h1 {
      margin: 0;
      font-size: clamp(29px, 6vw, 43px);
      font-weight: normal;
      line-height: 1.2;
      text-wrap: balance;
    }

    .welcome-copy {
      max-width: 340px;
      margin: 19px auto 0;
      font-size: clamp(18px, 4vw, 22px);
      line-height: 1.55;
      text-wrap: balance;
    }

    .welcome-note {
      max-width: 290px;
      margin: 17px auto 0;
      color: var(--muted);
      font: 12px/1.8 system-ui, sans-serif;
      text-wrap: pretty;
    }

    /* Маленькая солнечная печать на письме. */
    .seal {
      position: relative;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      margin: 25px auto 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--bg);
    }

    .seal::before {
      content: "";
      width: 17px;
      height: 17px;
      border: 1px solid var(--line);
      border-radius: 50%;
    }

    .seal::after {
      content: "";
      position: absolute;
      width: 27px;
      height: 1px;
      background: var(--line);
    }

    /* После открытия — только солнце и свободный текст. */
    .sun {
      position: relative;
      flex: 0 0 auto;
      width: 53px;
      height: 53px;
      margin: 0 auto 30px;
      border: 1px solid var(--line);
      border-radius: 50%;
    }

    .sun::before {
      content: "";
      position: absolute;
      inset: -30px;
      border-radius: 50%;
      background: radial-gradient(
        circle, var(--peach), transparent 70%
      );
      animation: breathe 7s ease-in-out infinite;
    }

    .sun::after {
      content: "";
      position: absolute;
      left: -17px;
      right: -17px;
      top: 50%;
      height: 1px;
      background: var(--line);
      opacity: .7;
    }

    .compliment {
      margin: 0;
      font-size: clamp(25px, 5.5vw, 37px);
      font-weight: normal;
      line-height: 1.45;
      text-wrap: pretty;
      overflow-wrap: break-word;
    }

    .surprise-label {
      margin: -7px 0 20px;
      color: var(--muted);
      font: 10px/1.7 system-ui, sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .stage.surprise .compliment {
      font-style: italic;
    }

    .button-wrap {
      position: relative;
      width: fit-content;
      max-width: 100%;
      margin: 29px auto 0;
      isolation: isolate;
    }

    button {
      position: relative;
      overflow: hidden;
      display: block;
      max-width: 100%;
      min-height: 55px;
      padding: 17px 27px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: var(--accent);
      color: var(--button-text);
      font: 500 13px/1.5 system-ui, sans-serif;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition:
        transform 180ms ease,
        box-shadow 180ms ease;
    }

    #button-label {
      position: relative;
      z-index: 1;
    }

    @media (hover: hover) {
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 9px 28px var(--shadow);
      }
    }

    button:active {
      transform: scale(.98);
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 6px;
    }

    button[aria-disabled="true"] {
      cursor: wait;
    }

    .ripple {
      position: absolute;
      width: 20px;
      height: 20px;
      margin: -10px 0 0 -10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .28);
      pointer-events: none;
      animation: ripple 850ms ease-out forwards;
    }

    .button-wrap::before {
      content: "";
      position: absolute;
      inset: -18px;
      z-index: -1;
      border-radius: 50%;
      background: radial-gradient(
        ellipse, var(--peach), transparent 70%
      );
      opacity: 0;
      pointer-events: none;
    }

    .button-wrap.glowing::before {
      animation: glow-wave 1100ms ease-out;
    }

    footer {
      min-height: 24px;
      margin-top: 31px;
      color: var(--muted);
      font: 12px/1.8 system-ui, sans-serif;
      transition: opacity 250ms ease;
      text-wrap: balance;
    }

    footer.fading {
      opacity: 0;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes breathe {
      0%, 100% { opacity: .45; transform: scale(.9); }
      50%      { opacity: 1; transform: scale(1.15); }
    }

    @keyframes drift {
      0%, 100% {
        opacity: 0;
        transform: translate3d(0, 14px, 0);
      }
      30% { opacity: .35; }
      70% { opacity: .2; }
      90% {
        opacity: 0;
        transform: translate3d(18px, -45px, 0);
      }
    }

    @keyframes ripple {
      from { opacity: .65; transform: scale(0); }
      to   { opacity: 0; transform: scale(32); }
    }

    @keyframes glow-wave {
      0%   { opacity: 0; transform: scale(.7); }
      35%  { opacity: 1; }
      100% { opacity: 0; transform: scale(1.8); }
    }

    @media (max-width: 380px) {
      body { padding-left: 16px; padding-right: 16px; }
      .stage { padding: 30px 18px; }
      .brand { margin-bottom: 22px; }
    }

    /* Не заставляем анимации работать в скрытой вкладке. */
    body.paused *,
    body.paused *::before,
    body.paused *::after {
      animation-play-state: paused !important;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }

      .particle {
        opacity: .18;
      }
    }
  </style>
</head>

<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="aura active" data-tone="peach"></div>
    <div class="aura" data-tone="rose"></div>
    <div class="aura" data-tone="lilac"></div>
    <div class="aura" data-tone="honey"></div>
  </div>

  <div class="grain" aria-hidden="true"></div>

  <div class="particles" aria-hidden="true">
    <i class="particle"
       style="--x:12%;--y:24%;--size:3px;--duration:13s;--delay:-3s"></i>
    <i class="particle"
       style="--x:85%;--y:19%;--size:2px;--duration:16s;--delay:-8s"></i>
    <i class="particle"
       style="--x:22%;--y: seventy;--y: seventy;--y:70%;--size:2px;--duration:18s;--delay:-5s"></i>
    <i class="particle"
       style="--x:78%;--y:76%;--size:3px;--duration:15s;--delay:-11s"></i>
    <i class="particle"
       style="--x:53%;--y:12%;--size:2px;--duration:19s;--delay:-14s"></i>
    <i class="particle"
       style="--x:9%;--y:49%;--size:2px;--duration:17s;--delay:-9s"></i>
    <i class="particle"
       style="--x:92%;--y:51%;--size:2px;--duration:14s;--delay:-6s"></i>
  </div>

  <main>
    <p class="brand">Шёпот Эос</p>

    <section class="stage welcome" id="stage"
             aria-label="Маленькое послание">
      <p class="eyebrow">одно маленькое послание</p>

      <h1>Василиса Романовна,</h1>

      <p class="welcome-copy">
        у этого маленького чуда<br>
        сегодня твоё имя.
      </p>

      <p class="welcome-note">
        Здесь можно никуда не спешить.
        Для тебя есть несколько тёплых слов.
      </p>

      <div class="seal" aria-hidden="true"></div>
    </section>

    <div class="button-wrap" id="button-wrap">
      <button id="button" type="button">
        <span id="button-label">Открыть послание</span>
      </button>
    </div>

    <p class="sr-only" id="announcement"
       aria-live="polite" aria-atomic="true"></p>

    <footer id="footer">
      Некоторые письма — совсем не про расстояния.
    </footer>

    <noscript>
      <p>Для открытия послания нужен JavaScript в браузере.</p>
    </noscript>
  </main>

  <script>
    // Оттенки:
    // peach — нежность, rose — флирт,
    // lilac — мечтательность, honey — свет и улыбки.

    const compliments = [
      {
        text: "В тебе есть свет, который не просит внимания, но делает всё вокруг немного прекраснее.",
        tone: "peach"
      },
      {
        text: "Ты — как строчка в любимой книге: её знаешь наизусть, но всё равно перечитываешь с улыбкой.",
        tone: "peach"
      },
      {
        text: "Твоя улыбка — маленькая весна, которой не нужно сверяться с календарём.",
        tone: "honey"
      },
      {
        text: "В тебе есть редкое очарование: рядом с тобой даже обычный день кажется неслучайным.",
        tone: "rose"
      },
      {
        text: "Если бы нежность можно было нарисовать, художнику всё равно пришлось бы искать вдохновение в тебе.",
        tone: "peach"
      },
      {
        text: "У твоего очарования явно нет привычки предупреждать о своём появлении.",
        tone: "rose"
      },
      {
        text: "Ты похожа на первый тёплый ветер: цветы ещё не раскрылись, а мир уже предвкушает что-то хорошее.",
        tone: "peach"
      },
      {
        text: "Тебе не нужно быть ярче всех. У твоего света есть то, чего не повторит ни одна звезда.",
        tone: "lilac"
      },
      {
        text: "В тебе прекрасно не только сияние, но и глубина, из которой оно рождается.",
        tone: "lilac"
      },
      {
        text: "Если бы звёзды коллекционировали земные чудеса, твоя улыбка занимала бы отдельное созвездие.",
        tone: "lilac"
      },
      {
        text: "Ты — та самая деталь, из-за которой простой пейзаж вдруг становится картиной.",
        tone: "honey"
      },
      {
        text: "В тебе есть красота, после которой хочется замечать прекрасное внимательнее.",
        tone: "peach"
      },
      {
        text: "Кажется, рассвет немного подражает тебе: тоже приходит и делает всё мягче.",
        tone: "peach"
      },
      {
        text: "Ты не украшение чужой истории. Ты — целое небо со своими созвездиями.",
        tone: "lilac"
      },
      {
        text: "Твой смех мог бы быть уважительной причиной, чтобы ненадолго остановить время.",
        tone: "honey"
      },
      {
        text: "Есть девушки, которым дарят стихи. А есть ты — из-за которой их начинают писать.",
        tone: "rose"
      },
      {
        text: "Тебе удивительно идёт быть собой. Ни одному образу не сравниться с оригиналом.",
        tone: "peach"
      },
      {
        text: "Если бы этот день был конвертом, самым тёплым письмом внутри была бы ты.",
        tone: "peach"
      },
      {
        text: "Ты — как музыка из открытого окна: всего мгновение, а мир уже кажется добрее.",
        tone: "honey"
      },
      {
        text: "У тебя есть собственная гравитация. Иначе почему мысли так легко возвращаются к тебе?",
        tone: "rose"
      },
      {
        text: "Твоя красота не требует восклицательных знаков. Иногда от восхищения просто становится тихо.",
        tone: "rose"
      },
      {
        text: "Если бы Афродита вела дневник вдохновения, для тебя в нём нашлась бы отдельная глава.",
        tone: "rose"
      },
      {
        text: "Эос каждое утро раскрашивает небо. Но тебе для очарования даже не нужны такие декорации.",
        tone: "honey"
      },
      {
        text: "Ты могла бы быть музой. Но быть собой у тебя получается гораздо интереснее.",
        tone: "lilac"
      },
      {
        text: "Ты — убедительный аргумент в пользу того, что у вселенной хороший вкус.",
        tone: "rose"
      },
      {
        text: "Ты похожа на сад после дождя: в тебе столько жизни, что даже слова хочется выбирать бережнее.",
        tone: "peach"
      },
      {
        text: "Миру очень идёт твоё присутствие.",
        tone: "honey"
      },
      {
        text: "Некоторые мгновения хочется сохранить между страницами, как цветы. Твоя улыбка — одно из них.",
        tone: "peach"
      },
      {
        text: "В тебе есть та лёгкость, с которой солнечный блик превращает обычную стену в маленькое чудо.",
        tone: "honey"
      },
      {
        text: "Ты прекрасна не как что-то. Ты прекрасна так, что хочется придумывать новые сравнения.",
        tone: "rose"
      },
      {
        text: "Даже эти слова сейчас немного волнуются: им хочется оказаться достойными твоей улыбки.",
        tone: "rose"
      },
      {
        text: "Твоя нежность — не хрупкость. Это сила, которая умеет обходиться без шума.",
        tone: "peach"
      },
      {
        text: "Есть свет, от которого щурятся. А есть твой — к нему хочется повернуться.",
        tone: "honey"
      },
      {
        text: "Ты — как неожиданная любимая песня посреди обычного дня.",
        tone: "honey"
      },
      {
        text: "Если бы луна увидела, как тебе идёт мягкий свет, она бы задержалась над твоим окном чуть дольше.",
        tone: "lilac"
      },
      {
        text: "Тебе не нужен идеальный день, чтобы быть прекрасной его частью.",
        tone: "peach"
      },
      {
        text: "Твоё очарование похоже на аромат цветущего сада: его не удержать в ладонях, но трудно забыть.",
        tone: "rose"
      },
      {
        text: "Наверное, поэзия и появилась потому, что однажды обычных слов для такой девушки оказалось мало.",
        tone: "rose"
      },
      {
        text: "Если бы тёплый свет мог выбирать, где ему остаться, он выбрал бы твою улыбку.",
        tone: "honey"
      },
      {
        text: "Ты похожа на хорошую новость, которую хочется перечитать ещё раз.",
        tone: "honey"
      },
      {
        text: "Есть красота, которую замечают. Твою — уносят с собой в памяти.",
        tone: "rose"
      },
      {
        text: "Ты словно оставляешь на дне обычных минут немного золотой пыльцы.",
        tone: "honey"
      },
      {
        text: "Твоя улыбка могла бы стать маленьким праздником без даты и повода.",
        tone: "honey"
      },
      {
        text: "Этот сайт маленький только потому, что восхищение пока не научились измерять пикселями.",
        tone: "rose"
      },
      {
        text: "Если бы мечтам требовался путеводный свет, они могли бы ориентироваться на тебя.",
        tone: "lilac"
      },
      {
        text: "В тебе есть что-то от тихого звёздного вечера: хочется отложить все дела и просто любоваться.",
        tone: "lilac"
      },
      {
        text: "Ты умеешь быть той самой неожиданной нежностью, которой не хватало целому дню.",
        tone: "peach"
      },
      {
        text: "Рядом с тобой у времени, кажется, появляется желание идти помедленнее.",
        tone: "rose"
      }
    ];

    const surprises = [
      {
        text: "На самом деле, кнопка здесь — просто повод сказать тебе ещё что-нибудь хорошее.",
        tone: "rose"
      },
      {
        text: "Маленькая пауза. Если ты сейчас улыбаешься, у этого сайта всё получилось.",
        tone: "honey"
      },
      {
        text: "Здесь нет последней страницы. Когда тёплые слова заканчиваются, они просто начинают новый круг.",
        tone: "lilac"
      },
      {
        text: "Это не предсказание и не знак судьбы. Просто маленькое напоминание: ты заслуживаешь нежности.",
        tone: "peach"
      }
    ];

    const footnotes = [
      "это место никуда не торопится",
      "маленькие чудеса тоже считаются",
      "ещё немного света — и можно дальше",
      "у нежности нет обязательного повода",
      "пусть эта минута будет тёплой",
      "некоторые слова похожи на объятия"
    ];

    const stage = document.getElementById("stage");
    const button = document.getElementById("button");
    const buttonLabel = document.getElementById("button-label");
    const buttonWrap = document.getElementById("button-wrap");
    const footer = document.getElementById("footer");
    const announcement = document.getElementById("announcement");
    const auras = [...document.querySelectorAll(".aura")];

    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    );

    const storageKey = "eos-letter-v3";

    let remaining = [];
    let lastIndex = -1;
    let surpriseIndex = 0;
    let footnoteIndex = 0;
    let clicks = 0;
    let busy = false;
    let glowTimer;

    // В истории хранятся только номера фраз.
    // Никакие данные не отправляются с сайта.
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey));

      const validIndex = value =>
        Number.isInteger(value) &&
        value >= 0 &&
        value < compliments.length;

      if (
        saved &&
        saved.total === compliments.length &&
        Array.isArray(saved.remaining) &&
        saved.remaining.every(validIndex) &&
        new Set(saved.remaining).size === saved.remaining.length &&
        (saved.last === -1 || validIndex(saved.last))
      ) {
        remaining = saved.remaining;
        lastIndex = saved.last;
      }
    } catch {
      // При запрете хранилища сайт работает без сохранения.
    }

    function saveHistory() {
      try {
        localStorage.setItem(storageKey, JSON.stringify({
          total: compliments.length,
          remaining: remaining,
          last: lastIndex
        }));
      } catch {
        // Сохранение не является обязательным для работы.
      }
    }

    function refill() {
      remaining = compliments.map((_, index) => index);

      // Перемешиваем все фразы в случайном порядке.
      for (let i = remaining.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [remaining[i], remaining[j]] =
          [remaining[j], remaining[i]];
      }

      // Не повторяем фразу на границе двух кругов.
      const end = remaining.length - 1;

      if (remaining[end] === lastIndex && remaining.length > 1) {
        [remaining[0], remaining[end]] =
          [remaining[end], remaining[0]];
      }
    }

    function nextCompliment() {
      if (remaining.length === 0) refill();

      lastIndex = remaining.pop();
      saveHistory();

      return compliments[lastIndex];
    }

    function setTone(tone) {
      auras.forEach(aura => {
        aura.classList.toggle(
          "active",
          aura.dataset.tone === tone
        );
      });
    }

    function renderMessage(item, isSurprise) {
      const sun = document.createElement("div");
      sun.className = "sun";
      sun.setAttribute("aria-hidden", "true");

      const heading = document.createElement("h1");
      heading.className = "sr-only";
      heading.textContent = isSurprise
        ? "Маленькая записка"
        : "Несколько тёплых слов";

      const paragraph = document.createElement("p");
      paragraph.className = "compliment";
      paragraph.textContent = item.text;

      const elements = [heading, sun];

      if (isSurprise) {
        const label = document.createElement("p");
        label.className = "surprise-label";
        label.textContent = "между строк";
        elements.push(label);
      }

      elements.push(paragraph);

      stage.replaceChildren(...elements);
      stage.classList.remove("welcome");
      stage.classList.toggle("surprise", isSurprise);

      buttonLabel.textContent = isSurprise
        ? "Читать дальше"
        : "Ещё немного тепла";

      announcement.textContent = item.text;
      setTone(item.tone);
    }

    function touchLight(event) {
      if (reducedMotion.matches) return;

      const rect = button.getBoundingClientRect();
      const ripple = document.createElement("span");

      // Для клавиатурного нажатия волна идёт из центра.
      const x = event.detail === 0
        ? rect.width / 2
        : event.clientX - rect.left;

      const y = event.detail === 0
        ? rect.height / 2
        : event.clientY - rect.top;

      ripple.className = "ripple";
      ripple.setAttribute("aria-hidden", "true");
      ripple.style.left = `${x}px`;
      ripple.style.top = `${y}px`;

      button.append(ripple);
      setTimeout(() => ripple.remove(), 900);

      clearTimeout(glowTimer);
      buttonWrap.classList.remove("glowing");

      // Перезапускаем внешнюю световую волну.
      void buttonWrap.offsetWidth;
      buttonWrap.classList.add("glowing");

      glowTimer = setTimeout(() => {
        buttonWrap.classList.remove("glowing");
      }, 1150);
    }

    const wait = milliseconds => new Promise(resolve => {
      setTimeout(resolve, milliseconds);
    });

    async function changeFootnote() {
      footer.classList.add("fading");
      await wait(reducedMotion.matches ? 0 : 250);

      footer.textContent =
        footnotes[footnoteIndex % footnotes.length];

      footnoteIndex++;
      footer.classList.remove("fading");
    }

    button.addEventListener("click", async event => {
      if (busy) return;

      busy = true;
      button.setAttribute("aria-disabled", "true");

      try {
        touchLight(event);

        const duration = reducedMotion.matches ? 0 : 370;

        // Сохраняем текущую высоту на время смены,
        // чтобы кнопка не подпрыгивала между фразами.
        const previousHeight = stage.getBoundingClientRect().height;
        stage.style.minHeight = `${previousHeight}px`;

        stage.classList.add("is-hidden");
        await wait(duration);

        clicks++;

        // Каждое седьмое нажатие — маленькая записка.
        const isSurprise = clicks % 7 === 0;

        const item = isSurprise
          ? surprises[surpriseIndex++ % surprises.length]
          : nextCompliment();

        renderMessage(item, isSurprise);

        // Если тексту нужно больше места, увеличиваем область.
        // На маленьком экране текст не обрезается.
        const currentHeight = stage.getBoundingClientRect().height;
        stage.style.minHeight =
          `${Math.max(previousHeight, currentHeight)}px`;

        stage.classList.remove("is-hidden");

        if (clicks === 1 || clicks % 4 === 0) {
          await changeFootnote();
        }

        await wait(duration);
      } finally {
        stage.classList.remove("is-hidden");
        button.removeAttribute("aria-disabled");
        busy = false;
      }
    });

    // После поворота телефона пересчитываем пространство.
    let resizeTimer;

    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);

      resizeTimer = setTimeout(() => {
        if (!busy) stage.style.minHeight = "";
      }, 180);
    });

    function updateVisibility() {
      document.body.classList.toggle("paused", document.hidden);
    }

    document.addEventListener("visibilitychange", updateVisibility);
    updateVisibility();
  </script>
</body>
</html>

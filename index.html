<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#18131c">
<meta name="description" content="Маленькая вселенная тёплых слов.">
<meta name="robots" content="noindex, nofollow">
<title>Маленькая вселенная</title>

<style>
  * { box-sizing: border-box; }

  :root {
    color-scheme: dark;
    --bg: #18131c;
    --ink: #f8e8e4;
    --muted: #c6aab8;
    --accent: #efb4cc;
    --button-ink: #291521;
    --wash: #a3296055;
    --line: #edbacb;
    --card: #2a1829;
  }

  body[data-scene="velvet"] {
    color-scheme: dark;
    --bg: #1b101a;
    --ink: #ffedf0;
    --muted: #d5acba;
    --accent: #efa0b8;
    --button-ink: #321323;
    --wash: #c9235859;
    --line: #f1a3bd;
    --card: #361926;
  }

  body[data-scene="diamond"] {
    color-scheme: dark;
    --bg: #101e2b;
    --ink: #edfaff;
    --muted: #adc6d6;
    --accent: #afe9f5;
    --button-ink: #142c3a;
    --wash: #439dce4d;
    --line: #a5eaff;
    --card: #1c3446;
  }

  body[data-scene="pink"] {
    color-scheme: light;
    --bg: #f8dde6;
    --ink: #641b43;
    --muted: #844562;
    --accent: #902754;
    --button-ink: #fff0f5;
    --wash: #e8458452;
    --line: #ae3264;
    --card: #f9eaf0;
  }

  body[data-scene="violet"] {
    color-scheme: dark;
    --bg: #23153e;
    --ink: #f5eaff;
    --muted: #c8b5de;
    --accent: #d7b8ff;
    --button-ink: #2b1648;
    --wash: #ac68de59;
    --line: #d9b5fc;
    --card: #392450;
  }

  body[data-scene="gold"] {
    color-scheme: light;
    --bg: #faf0dc;
    --ink: #543420;
    --muted: #7b5739;
    --accent: #865021;
    --button-ink: #fff6e5;
    --wash: #e9a83952;
    --line: #af6e25;
    --card: #fff6e5;
  }

  html {
    min-height: 100%;
    background: #18131c;
  }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    padding: 30px 20px;
    padding-top: max(30px, env(safe-area-inset-top));
    padding-bottom: max(30px, env(safe-area-inset-bottom));
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
    isolation: isolate;
    transition: background-color 950ms ease, color 700ms ease;
  }

  .backdrop, .texture, .decor {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .backdrop {
    z-index: -3;
    background:
      radial-gradient(ellipse at 15% 20%, var(--wash), transparent 55%),
      radial-gradient(ellipse at 90% 80%, var(--wash), transparent 50%);
  }

  .texture {
    z-index: -1;
    opacity: .16;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23888' filter='url(%23n)' opacity='.35' d='M0 0h160v160H0z'/%3E%3C/svg%3E");
  }

  .decor { z-index: -2; }

  .motif {
    position: absolute;
    opacity: 0;
    transition: opacity 900ms ease, transform 1500ms ease;
    color: var(--line);
  }

  /* Бархатная ночь: большой тонкий ореол. */
  .halo {
    width: min(85vw, 570px);
    aspect-ratio: 1;
    left: -24%;
    top: 12%;
    border: 1px solid currentColor;
    border-radius: 50%;
    box-shadow: 0 0 90px var(--wash), inset 0 0 90px var(--wash);
    transform: scale(.8);
  }

  [data-scene="velvet"] .halo {
    opacity: .35;
    transform: scale(1);
  }

  /* Алмазный свет: прозрачные геометрические грани. */
  .facets {
    width: min(85vw, 530px);
    height: auto;
    right: -20%;
    top: 9%;
    transform: rotate(-10deg) scale(.9);
  }

  [data-scene="diamond"] .facets {
    opacity: .28;
    transform: rotate(8deg) scale(1);
  }

  /* Розовая плёнка: световой край и контур цветка. */
  .flower {
    width: 300px;
    height: 300px;
    left: -135px;
    bottom: 8%;
    transform: rotate(-15deg);
  }

  [data-scene="pink"] .flower {
    opacity: .25;
    transform: rotate(12deg);
  }

  .film-edge {
    width: 90px;
    top: 0;
    bottom: 0;
    right: -35px;
    background: linear-gradient(
      90deg, transparent, var(--wash), var(--line)
    );
    filter: blur(24px);
  }

  [data-scene="pink"] .film-edge { opacity: .45; }

  /* Фиалковый сон: наклонённые орбиты. */
  .orbit {
    width: min(120vw, 760px);
    height: 260px;
    top: 24%;
    left: -35%;
    border: 1px solid currentColor;
    border-radius: 50%;
    transform: rotate(-35deg) scale(.8);
  }

  .orbit::after {
    content: "";
    position: absolute;
    inset: 25px -15px;
    border: 1px solid currentColor;
    border-radius: 50%;
    transform: rotate(25deg);
  }

  [data-scene="violet"] .orbit {
    opacity: .25;
    transform: rotate(-25deg) scale(1);
  }

  /* Золотой час: смещённое солнце и линия горизонта. */
  .sun {
    width: 220px;
    height: 220px;
    border: 1px solid currentColor;
    border-radius: 50%;
    top: 6%;
    right: -95px;
    background: radial-gradient(circle, var(--wash), transparent 70%);
    transform: translateY(35px);
  }

  .sun::after {
    content: "";
    position: absolute;
    top: 55%;
    left: -130px;
    width: 390px;
    height: 1px;
    background: currentColor;
  }

  [data-scene="gold"] .sun {
    opacity: .35;
    transform: translateY(0);
  }

  /* Разовая засветка от края — без резкой вспышки. */
  .light-pass {
    position: absolute;
    inset: -30%;
    opacity: 0;
    background: linear-gradient(
      110deg, transparent 38%, var(--wash) 50%, transparent 62%
    );
  }

  .decor.play .light-pass {
    animation: light-pass 1400ms ease-in-out both;
  }

  .decor.play .motif {
    animation: accent-arrive 1200ms ease both;
  }

  main {
    width: min(100%, 610px);
    text-align: center;
    animation: appear 850ms ease both;
  }

  .brand {
    margin: 0 0 24px;
    color: var(--muted);
    font: 500 10px/1.7 system-ui, sans-serif;
    letter-spacing: .3em;
    text-transform: uppercase;
  }

  .stage {
    display: grid;
    align-content: center;
    min-height: 355px;
    padding: 25px 6px;
    opacity: 1;
    transform: translateY(0);
    transition: opacity 320ms ease, transform 420ms ease;
  }

  .stage.hidden {
    opacity: 0;
    transform: translateY(9px);
  }

  .stage.welcome {
    padding: 0;
    min-height: 0;
  }

  .stage.welcome.hidden {
    transform: scale(1.035);
  }

  /* Приветствие — отдельная обложка альбома. */
  .album {
    position: relative;
    isolation: isolate;
    width: min(100%, 420px);
    margin: 0 auto;
    min-height: 410px;
    padding: 39px 25px 30px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 1px solid #bd8ca04d;
    border-radius: 5px;
    background:
      radial-gradient(ellipse at 70% 15%, #ae3c6559, transparent 60%),
      linear-gradient(145deg, #362135, #16131e 75%);
    box-shadow: 0 25px 75px #00000033;
  }

  .album::before {
    content: "";
    position: absolute;
    z-index: -1;
    width: 350px;
    height: 160px;
    border: 1px solid #dbadc14d;
    border-radius: 50%;
    top: 30px;
    left: 15%;
    transform: rotate(-33deg);
  }

  .album::after {
    content: "";
    position: absolute;
    inset: 9px;
    border: 1px solid #f1d5e012;
    pointer-events: none;
  }

  .album-star {
    margin-bottom: 30px;
    color: #f1c8dc;
    font-size: 32px;
    animation: star-breathe 6s ease-in-out infinite;
  }

  .album-label {
    margin: 0 0 19px;
    color: #d4b2c2;
    font: 10px/1.6 system-ui, sans-serif;
    letter-spacing: .22em;
    text-transform: uppercase;
  }

  .album h1 {
    margin: 0;
    color: #fff0ee;
    font-size: clamp(29px, 7vw, 40px);
    font-weight: normal;
    line-height: 1.17;
  }

  .album-copy {
    margin: 22px 0 0;
    color: #e4cbd3;
    font-size: 18px;
    line-height: 1.65;
    text-wrap: balance;
  }

  .album-bottom {
    margin: 30px 0 0;
    color: #c0a1b0;
    font: 9px/1.7 system-ui, sans-serif;
    letter-spacing: .19em;
    text-transform: uppercase;
  }

  .scene-label {
    margin: 0 0 29px;
    color: var(--muted);
    font: 10px/1.7 system-ui, sans-serif;
    letter-spacing: .23em;
    text-transform: uppercase;
  }

  .message {
    margin: 0;
    font-size: clamp(26px, 5.8vw, 39px);
    font-weight: normal;
    line-height: 1.43;
    text-wrap: pretty;
    overflow-wrap: break-word;
  }

  .stage.note .message {
    font-style: italic;
    font-size: clamp(25px, 5.3vw, 35px);
  }

  .music-mark {
    display: block;
    margin: 26px 0 0;
    color: var(--muted);
    font: 10px/1.7 system-ui, sans-serif;
    letter-spacing: .12em;
  }

  .button-wrap {
    position: relative;
    width: fit-content;
    max-width: 100%;
    margin: 26px auto 0;
    isolation: isolate;
  }

  .button-wrap::before {
    content: "";
    position: absolute;
    inset: -9px;
    border: 1px solid var(--line);
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
  }

  .button-wrap.pulse::before {
    animation: ring 1000ms ease-out both;
  }

  button {
    position: relative;
    overflow: hidden;
    display: block;
    min-height: 55px;
    max-width: 100%;
    padding: 17px 26px;
    border: 1px solid transparent;
    border-radius: 999px;
    color: var(--button-ink);
    background: var(--accent);
    font: 500 13px/1.5 system-ui, sans-serif;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition:
      background-color 750ms ease,
      color 750ms ease,
      transform 180ms ease;
  }

  button:active { transform: scale(.98); }

  button:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 6px;
  }

  button[aria-disabled="true"] { cursor: wait; }

  @media (hover: hover) {
    button:hover { transform: translateY(-2px); }
  }

  .constellation {
    display: block;
    width: 132px;
    height: 45px;
    margin: 22px auto 0;
    overflow: visible;
    color: var(--line);
    opacity: 1;
    transition: opacity 500ms ease;
  }

  body.intro .constellation {
    display: none;
  }

  .constellation circle,
  .constellation path {
    opacity: 0;
    transition: opacity 700ms ease;
  }

  .constellation .visible { opacity: .7; }

  footer {
    min-height: 21px;
    margin-top: 13px;
    color: var(--muted);
    font: 11px/1.8 system-ui, sans-serif;
    text-wrap: balance;
  }

  body.intro footer { margin-top: 22px; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  @keyframes appear {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes star-breathe {
    0%, 100% { opacity: .55; transform: scale(.94); }
    50% { opacity: 1; transform: scale(1.06); }
  }

  @keyframes light-pass {
    0% { opacity: 0; transform: translateX(-35%); }
    45% { opacity: .6; }
    100% { opacity: 0; transform: translateX(35%); }
  }

  @keyframes accent-arrive {
    0% { translate: 0 12px; }
    100% { translate: 0 0; }
  }

  @keyframes ring {
    0% { opacity: 0; transform: scale(.96); }
    25% { opacity: .4; }
    100% { opacity: 0; transform: scale(1.25, 1.7); }
  }

  @media (max-width: 370px) {
    body { padding-left: 17px; padding-right: 17px; }
    .album { padding: 32px 19px; min-height: 380px; }
    .stage:not(.welcome) { min-height: 375px; }
  }

  body.paused *,
  body.paused *::before,
  body.paused *::after {
    animation-play-state: paused !important;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>

<body class="intro" data-scene="intro">
  <div class="backdrop" aria-hidden="true"></div>
  <div class="texture" aria-hidden="true"></div>

  <div class="decor" id="decor" aria-hidden="true">
    <div class="motif halo"></div>

    <svg class="motif facets" viewBox="0 0 400 500"
         fill="none" stroke="currentColor" stroke-width="1">
      <path d="M200 20 365 170 290 425 100 460 25 205Z"/>
      <path d="M200 20 230 205 365 170M230 205 290 425
               M230 205 100 460M230 205 25 205
               M25 205 200 20M100 460 365 170"/>
    </svg>

    <svg class="motif flower" viewBox="0 0 300 300"
         fill="none" stroke="currentColor" stroke-width="1">
      <ellipse cx="150" cy="150" rx="45" ry="125"/>
      <ellipse cx="150" cy="150" rx="45" ry="125"
               transform="rotate(60 150 150)"/>
      <ellipse cx="150" cy="150" rx="45" ry="125"
               transform="rotate(120 150 150)"/>
      <circle cx="150" cy="150" r="22"/>

    <div class="motif film-edge"></div>
    <div class="motif orbit"></div>
    <div class="motif sun"></div>
    <div class="light-pass"></div>
  </div>

  <main>
    <p class="brand" id="brand">маленькая вселенная · личное издание</p>

    <section class="stage welcome" id="stage"
             aria-label="Личное послание">
      <div class="album">
        <div class="album-star" aria-hidden="true">✧</div>
        <p class="album-label">посвящается тебе</p>

        <h1>Василиса<br>Романовна</h1>

        <p class="album-copy">
          Если бы тёплые слова<br>
          могли стать альбомом,<br>
          этот был бы посвящён тебе.
        </p>

        <p class="album-bottom">мягкость внутри · электричество снаружи</p>
      </div>
    </section>

    <div class="button-wrap" id="button-wrap">
      <button type="button" id="button">
        Включить маленькую вселенную
      </button>
    </div>

    <svg class="constellation" viewBox="0 0 132 45"
         aria-hidden="true">
      <path d="M9 29 30 14" stroke="currentColor" fill="none"/>
      <path d="M30 14 52 27" stroke="currentColor" fill="none"/>
      <path d="M52 27 77 10" stroke="currentColor" fill="none"/>
      <path d="M77 10 99 25" stroke="currentColor" fill="none"/>
      <path d="M99 25 123 15" stroke="currentColor" fill="none"/>

      <circle cx="9" cy="29" r="2" fill="currentColor"/>
      <circle cx="30" cy="14" r="2" fill="currentColor"/>
      <circle cx="52" cy="27" r="2" fill="currentColor"/>
      <circle cx="77" cy="10" r="2" fill="currentColor"/>
      <circle cx="99" cy="25" r="2" fill="currentColor"/>
      <circle cx="123" cy="15" r="2" fill="currentColor"/>
    </svg>

    <footer id="footer">здесь звучат слова, не музыка</footer>

    <p class="sr-only" id="announcement"
       aria-live="polite" aria-atomic="true"></p>

    <noscript>
      <p>Чтобы открыть послание, включи JavaScript в браузере.</p>
    </noscript>
  </main>

<script>

    ["Наверное, поэзия и появилась потому, что однажды обычных слов для такой девушки оказалось мало.", "velvet"],
    ["Если бы тёплый свет мог выбирать, где ему остаться, он выбрал бы твою улыбку.", "gold"],
    ["Ты похожа на хорошую новость, которую хочется перечитать ещё раз.", "pink"],
    ["Есть красота, которую замечают. Твою — уносят с собой в памяти.", "velvet"],
    ["Ты словно оставляешь на дне обычных минут немного золотой пыльцы.", "gold"],
    ["Твоя улыбка могла бы стать маленьким праздником без даты и повода.", "pink"],
    ["Этот сайт маленький только потому, что восхищение пока не научились измерять пикселями.", "violet"],
    ["Если бы мечтам требовался путеводный свет, они могли бы ориентироваться на тебя.", "diamond"],
    ["В тебе есть что-то от тихого звёздного вечера: хочется отложить все дела и просто любоваться.", "violet"],
    ["Ты умеешь быть той самой неожиданной нежностью, которой не хватало целому дню.", "pink"],
    ["Рядом с тобой у времени, кажется, появляется желание идти помедленнее.", "velvet"]
  ];

  const musical = [
    ["Твои глаза красивее, чем обещает название Diamond Eyes.", "diamond"],
    ["Если бы у этой нежности был саундтрек, сейчас играла бы Sextape.", "violet"],
    ["В тебе есть что-то от Beauty School: хочется поставить весь остальной мир на паузу.", "pink"],
    ["Be Quiet and Drive — а можно просто помолчать рядом с тобой, и никуда не ехать?", "velvet"],
    ["Если бы Cherry Waves были цветом, ими можно было бы нарисовать этот вечер. Но для твоей улыбки всё равно понадобился бы свет.", "velvet"],
    ["Твоя улыбка — любимый неожиданный переход от тяжёлых гитар к чему-то невероятно нежному.", "gold"],
    ["Некоторые песни хочется слушать на повторе. А некоторые мгновения с тобой — проживать ещё раз.", "violet"],
    ["Рядом с тобой даже самый шумный день хочется поставить на тихую громкость — чтобы не пропустить твой голос.", "diamond"]
  ];

  const notes = [
    "Музыкальные отсылки здесь не случайны. Хотелось, чтобы ты узнала в этом маленьком мире что-то своё.",
    "На самом деле, кнопка здесь — просто повод сказать тебе ещё что-нибудь хорошее.",
    "Маленькая пауза. Если ты сейчас улыбаешься, у этого сайта всё получилось.",
    "Здесь нет последнего трека. Когда тёплые слова заканчиваются, они просто начинают новый круг."
  ];

  const scenes = {
    velvet:  { label: "бархатная ночь", color: "#1b101a" },
    diamond: { label: "алмазный свет", color: "#101e2b" },
    pink:    { label: "розовая плёнка", color: "#f8dde6" },
    violet:  { label: "фиалковый сон", color: "#23153e" },
    gold:    { label: "золотой час", color: "#faf0dc" }
  };

  const footnotes = [
    "маленькие чудеса тоже считаются",
    "у нежности нет обязательного повода",
    "мягкость тоже умеет звучать громко",
    "ещё немного света — и можно дальше",
    "некоторые слова похожи на объятия"
  ];

  const stage = document.getElementById("stage");
  const button = document.getElementById("button");
  const buttonWrap = document.getElementById("button-wrap");
  const decor = document.getElementById("decor");
  const footer = document.getElementById("footer");
  const brand = document.getElementById("brand");
  const announcement = document.getElementById("announcement");
  const themeMeta = document.querySelector('meta[name="theme-color"]');
  const stars = [...document.querySelectorAll(".constellation circle")];
  const links = [...document.querySelectorAll(".constellation path")];

  const motion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const storageKey = "little-universe-album-v4";

  const pools = { ordinary, musical };

  let history = {
    ordinary: { queue: [], last: -1 },
    musical: { queue: [], last: -1 }
  };

  let opened = false;
  let busy = false;
  let clicks = 0;
  let regularCount = 0;
  let noteCount = 0;
  let effectTimer;

  // История хранится только в этом браузере.
  // Ошибка хранилища не мешает пользоваться сайтом.
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey));

    for (const name of Object.keys(pools)) {
      const record = saved && saved[name];
      const size = pools[name].length;
      const valid = n => Number.isInteger(n) && n >= 0 && n < size;

      if (
        record &&
        Array.isArray(record.queue) &&
        record.queue.every(valid) &&
        new Set(record.queue).size === record.queue.length &&
        (record.last === -1 || valid(record.last))
      ) {
        history[name] = record;
      }
    }
  } catch {
    // Продолжаем с новой историей.
  }

  function save() {
    try {
      localStorage.setItem(storageKey, JSON.stringify(history));
    } catch {
      // Например, браузер запретил запись.
    }
  }

  function shuffledIndices(length) {
    const indices = Array.from({ length }, (_, i) => i);

    for (let i = length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }

    return indices;
  }

  function take(name, preferredScene) {
    const pool = pools[name];
    const state = history[name];

    if (!state.queue.length) {
      state.queue = shuffledIndices(pool.length);
    }

    const currentScene = document.body.dataset.scene;

    // Из оставшихся фраз выбираем другую сцену, если возможно.
    // Поэтому история без повторов не нарушается.
    let candidates = state.queue.filter(index =>
      index !== state.last &&
      pool[index][1] !== currentScene
    );

    if (preferredScene) {
      const preferred = candidates.filter(index =>
        pool[index][1] === preferredScene
      );
      if (preferred.length) candidates = preferred;
    }

    if (!candidates.length) {
      candidates = state.queue.filter(index => index !== state.last);
    }

    if (!candidates.length) candidates = [...state.queue];

    const index = candidates[Math.floor(Math.random() * candidates.length)];

    state.queue.splice(state.queue.indexOf(index), 1);
    state.last = index;
    save();

    return {
      text: pool[index][0],
      scene: pool[index][1],
      music: name === "musical",
      note: false
    };
  }

  function nextMessage() {
    // Редкие записки не заменяют музыкальную очередь.
    if (clicks % 11 === 0) {
      return {
        text: notes[noteCount++ % notes.length],
        scene: "velvet",
        music: false,
        note: true
      };
    }

    regularCount++;

    // Каждый шестой комплимент — музыкальная пасхалка.
    if (regularCount % 6 === 0) return take("musical");

    // После тёмной обложки сначала раскрываем светлую сцену.
    return take("ordinary", clicks === 1 ? "gold" : null);
  }

  function render(item) {
    document.body.dataset.scene = item.scene;
    document.body.classList.remove("intro");
    themeMeta.content = scenes[item.scene].color;
    brand.textContent = "маленькая вселенная · для тебя";

    stage.classList.remove("welcome");
    stage.classList.toggle("note", item.note);

    const label = document.createElement("p");
    label.className = "scene-label";
    label.textContent = item.note
      ? "сторона B · между строк"
      : scenes[item.scene].label;

    const heading = document.createElement("h1");
    heading.className = "sr-only";
    heading.textContent = item.note
      ? "Маленькая записка"
      : "Несколько тёплых слов";

    const paragraph = document.createElement("p");
    paragraph.className = "message";
    paragraph.textContent = item.text;

    const content = [heading, label, paragraph];

    if (item.music) {
      const mark = document.createElement("span");
      mark.className = "music-mark";
      mark.textContent = "маленькая отсылка к твоему плейлисту";
      content.push(mark);
    }

    stage.replaceChildren(...content);
    button.textContent = item.note ? "Читать дальше" : "Ещё немного магии";
    announcement.textContent = item.text;

    if (clicks === 1 || clicks % 4 === 0) {
      footer.textContent =
        footnotes[Math.floor(clicks / 4) % footnotes.length];
    }
  }

  function animateScene() {
    if (motion.matches) return;

    clearTimeout(effectTimer);
    decor.classList.remove("play");
    buttonWrap.classList.remove("pulse");

    void decor.offsetWidth;

    decor.classList.add("play");
    buttonWrap.classList.add("pulse");

    effectTimer = setTimeout(() => {
      decor.classList.remove("play");
      buttonWrap.classList.remove("pulse");
    }, 1500);
  }

  function updateConstellation() {
    const count = ((clicks - 1) % stars.length) + 1;

    stars.forEach((star, index) => {
      star.classList.toggle("visible", index < count);
    });

    links.forEach((link, index) => {
      link.classList.toggle("visible", index < count - 1);
    });
  }

  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  button.addEventListener("click", async () => {
    if (busy) return;

    busy = true;
    button.setAttribute("aria-disabled", "true");

    try {
      const delay = motion.matches ? 0 : 350;

      // После входа сохраняем высоту области,
      // чтобы кнопка меньше двигалась при смене фраз.
      if (opened) {
        stage.style.minHeight =
          `${stage.getBoundingClientRect().height}px`;
      }

      stage.classList.add("hidden");
      await wait(delay);

      clicks++;
      const item = nextMessage();

      render(item);
      opened = true;
      updateConstellation();

      // Фиксируем новую высоту, не обрезая длинный текст.
      stage.style.minHeight =
          `${stage.getBoundingClientRect().height}px`;

      stage.classList.remove("hidden");
      animateScene();

      await wait(delay);
    } finally {
      stage.classList.remove("hidden");
      button.removeAttribute("aria-disabled");
      busy = false;
    }
  });

  let resizeTimer;

  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (!busy) stage.style.minHeight = "";
    }, 200);
  });

  function updateVisibility() {
    document.body.classList.toggle("paused", document.hidden);
  }

  document.addEventListener("visibilitychange", updateVisibility);
  updateVisibility();
</script>
</body>
</html>

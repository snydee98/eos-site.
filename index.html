<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<meta name="description" content="Между станциями — немного света.">
<meta name="robots" content="noindex, nofollow">
<title>Маленькая вселенная</title>

<style>
* { box-sizing: border-box; }

:root {
  color-scheme: dark;
  --bg: #111827;
  --ink: #f4eef9;
  --muted: #bcc1d5;
  --accent: #d8c4ee;
  --button-ink: #251b37;
  --line: #cec4ed;
  --wash: #8270bb30;
  --panel: #1c2437;
}

body[data-scene="cover"],
body[data-scene="velvet"] {
  --bg: #21111e;
  --ink: #fff0f4;
  --muted: #d8afc6;
  --accent: #efb5d2;
  --button-ink: #32142a;
  --line: #e9aed1;
  --wash: #bd34674a;
  --panel: #321e31;
}

body[data-scene="diamond"] {
  --bg: #102532;
  --ink: #effaff;
  --muted: #b6cedd;
  --accent: #b4e7f4;
  --button-ink: #143041;
  --line: #afeaff;
  --wash: #389cc343;
  --panel: #1a3444;
}

body[data-scene="violet"] {
  --bg: #291840;
  --ink: #f5ecff;
  --muted: #d0bde1;
  --accent: #dbbfff;
  --button-ink: #311e4a;
  --line: #d8bbff;
  --wash: #ad70d74b;
  --panel: #39254f;
}

body[data-scene="pink"] {
  color-scheme: light;
  --bg: #f6dce7;
  --ink: #661f45;
  --muted: #814260;
  --accent: #902b59;
  --button-ink: #fff3f8;
  --line: #9d3664;
  --wash: #e54a8838;
  --panel: #fcebf2;
}

body[data-scene="gold"] {
  color-scheme: light;
  --bg: #faf0dc;
  --ink: #57361f;
  --muted: #7b573b;
  --accent: #865125;
  --button-ink: #fff5e5;
  --line: #99612b;
  --wash: #e7aa4144;
  --panel: #fff6e6;
}

html {
  min-height: 100%;
  background: #111827;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  padding: 35px 23px;
  padding-top: max(35px, env(safe-area-inset-top));
  padding-bottom: max(35px, env(safe-area-inset-bottom));
  display: grid;
  place-items: center;
  background: var(--bg);
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
  -webkit-font-smoothing: antialiased;
  transition: background-color 1200ms ease, color 900ms ease;
  isolation: isolate;
}

.background, .grain, .sky, .effects, .city {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.background {
  z-index: -4;
  background:
    radial-gradient(ellipse at 8% 18%, var(--wash), transparent 55%),
    radial-gradient(ellipse at 95% 85%, var(--wash), transparent 50%);
}

.grain {
  z-index: -1;
  opacity: .1;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath d='M0 0h140v140H0z' fill='%23888' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E");
}

/* Небо: точки — HTML-элементы, поэтому не растягиваются. */
.sky {
  z-index: -2;
  color: var(--line);
  opacity: .7;
  transition: opacity 900ms ease, color 900ms ease;
}

.sky svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.sky line {
  stroke: currentColor;
  stroke-width: .7;
  vector-effect: non-scaling-stroke;
  opacity: 0;
  transition: opacity 1100ms ease;
}

.sky line.on { opacity: .32; }

.star {
  position: absolute;
  width: 20px;
  height: 20px;
  margin: -10px;
  display: grid;
  place-items: center;
  opacity: 0;
  transition: opacity 1100ms ease;
}

.star.on { opacity: .8; }

.star-core {
  display: block;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 8px currentColor;
}

.star.twinkle .star-core {
  animation: twinkle var(--duration, 9s) ease-in-out infinite;
  animation-delay: var(--delay, 0s);
}

.star.music .star-core,
.star.note .star-core {
  width: 12px;
  height: 12px;
  background: currentColor;
  border-radius: 0;
  clip-path: polygon(
    50% 0, 60% 39%, 100% 50%, 60% 61%,
    50% 100%, 40% 61%, 0 50%, 40% 39%
  );
}

.star.drum::after {
  content: "";
  position: absolute;
  width: 11px;
  height: 11px;
  border: 1px solid currentColor;
  border-radius: 50%;
  opacity: .4;
}

.star.newborn {
  animation: star-born 1600ms ease both;
}

body[data-mode="metro"] .sky { opacity: 0; }
body[data-mode="cover"] .sky { opacity: .22; }
body[data-mode="final"] .sky { opacity: 1; }
body[data-mode="final"] .sky line.on { opacity: .5; }

/* Огни за окном. */
.city {
  z-index: -3;
  opacity: 0;
  transition: opacity 800ms ease;
}

body[data-mode="metro"] .city { opacity: 1; }

.city i {
  position: absolute;
  left: -45%;
  width: 40%;
  height: 1px;
  background: linear-gradient(90deg, transparent, #c4d4ef80, transparent);
  box-shadow: 0 0 16px #acc9f04d;
  animation: train-light 8s linear infinite;
}

.city i:nth-child(1) { top: 14%; animation-delay: -1s; }
.city i:nth-child(2) { top: 23%; animation-delay: -5s; opacity: .45; }
.city i:nth-child(3) { top: 80%; animation-delay: -3s; }
.city i:nth-child(4) { top: 89%; animation-delay: -7s; opacity: .4; }

/* Фоновые сцены. */
.effects { z-index: -3; }

.motif {
  position: absolute;
  color: var(--line);
  opacity: 0;
  transition: opacity 1000ms ease, transform 1400ms ease;
}

.orbit {
  width: min(120vw, 750px);
  height: 250px;
  left: -48%;
  top: 25%;
  border: 1px solid currentColor;
  border-radius: 50%;
  transform: rotate(-35deg);
}

.orbit::after {
  content: "";
  position: absolute;
  inset: 25px -10px;
  border: 1px solid currentColor;
  border-radius: 50%;
  transform: rotate(25deg);
}

[data-scene="violet"] .orbit {
  opacity: .22;
  transform: rotate(-22deg);
}

.halo {
  width: 370px;
  height: 370px;
  left: -245px;
  top: 20%;
  border: 1px solid currentColor;
  border-radius: 50%;
  box-shadow: 0 0 80px var(--wash), inset 0 0 80px var(--wash);
}

[data-scene="velvet"] .halo { opacity: .28; }

.facet {
  width: 250px;
  height: 330px;
  right: -175px;
  top: 20%;
  border: 1px solid currentColor;
  transform: rotate(25deg);
}

.facet::after {
  content: "";
  position: absolute;
  inset: 25px;
  border: 1px solid currentColor;
}

[data-scene="diamond"] .facet {
  opacity: .25;
  transform: rotate(40deg);
}

.flower {
  width: 280px;
  height: 280px;
  left: -165px;
  bottom: 10%;
  transform: rotate(-20deg);
}

[data-scene="pink"] .flower {
  opacity: .22;
  transform: rotate(12deg);
}

.sun {
  width: 210px;
  height: 210px;
  right: -125px;
  top: 12%;
  border: 1px solid currentColor;
  border-radius: 50%;
  background: radial-gradient(circle, var(--wash), transparent 70%);
}

.sun::after {
  content: "";
  position: absolute;
  left: -95px;
  right: -95px;
  top: 55%;
  height: 1px;
  background: currentColor;
}

[data-scene="gold"] .sun { opacity: .3; }

.sweep {
  position: absolute;
  inset: -40%;
  opacity: 0;
  background: linear-gradient(
    110deg, transparent 35%, var(--wash) 50%, transparent 65%
  );
}

.effects.play .sweep { animation: sweep 1500ms ease both; }

.resonance {
  position: absolute;
  width: 100px;
  height: 100px;
  left: -35px;
  top: 38%;
  border: 1px solid var(--line);
  border-radius: 50%;
  opacity: 0;
}

.effects.drum .resonance {
  animation: resonance 1800ms ease-out both;
}

.effects.drum .resonance.second { animation-delay: 220ms; }

.beam {
  position: absolute;
  top: -10%;
  left: 3%;
  width: 42%;
  height: 120%;
  opacity: 0;
  transform-origin: top center;
  background: linear-gradient(var(--wash), transparent 80%);
  clip-path: polygon(47% 0, 53% 0, 100% 100%, 0 100%);
}

.beam.second { left: 56%; }

.effects.spotlight .beam {
  animation: stage-light 4500ms ease both;
}

.effects.spotlight .beam.second {
  animation-direction: reverse;
}

.shooting-star {
  position: absolute;
  top: 12%;
  left: 8%;
  width: 90px;
  height: 1px;
  opacity: 0;
  background: linear-gradient(90deg, transparent, var(--line));
  transform: rotate(28deg);
}

.effects.shooting .shooting-star {
  animation: shooting 1700ms ease-out both;
}

main {
  width: min(100%, 590px);
  text-align: center;
  animation: arrive 900ms ease both;
}

.brand {
  margin: 0 0 25px;
  color: var(--muted);
  font: 500 10px/1.8 system-ui, sans-serif;
  letter-spacing: .24em;
  text-transform: uppercase;
}

.stage {
  min-height: 355px;
  display: grid;
  align-content: center;
  padding: 28px 10px;
  opacity: 1;
  transform: translateY(0);
  transition: opacity 380ms ease, transform 450ms ease;
}

.stage.hidden {
  opacity: 0;
  transform: translateY(8px);
}

.stage.cover { min-height: 0; padding: 0; }
.stage.cover.hidden { transform: scale(1.025); }

.metro-title, .final-title {
  margin: 0 0 25px;
  font-size: clamp(32px, 7.4vw, 46px);
  font-weight: normal;
  line-height: 1.2;
  text-wrap: balance;
}

.copy {
  max-width: 390px;
  margin: 0 auto 20px;
  font-size: 18px;
  line-height: 1.75;
  text-wrap: pretty;
}

.copy.muted {
  font-size: 15px;
  color: var(--muted);
}

.route {
  position: relative;
  display: flex;
  justify-content: space-between;
  width: 175px;
  margin: 31px auto 0;
}

.route::before {
  content: "";
  position: absolute;
  top: 4px;
  left: 0;
  right: 0;
  height: 1px;
  background: var(--line);
  opacity: .35;
  transition: opacity 800ms ease;
}

.route span {
  position: relative;
  width: 9px;
  height: 9px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--bg);
}

.stage.departing .route::before { opacity: 0; }

.stage.departing .route span {
  animation: station-star 950ms ease both;
}

.album {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  width: min(100%, 410px);
  min-height: 430px;
  margin: 0 auto;
  padding: 35px 23px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1px solid #dfafce40;
  border-radius: 5px;
  background:
    radial-gradient(ellipse at 90% 0%, #b4447850, transparent 60%),
    linear-gradient(145deg, #362237, #181523 80%);
  box-shadow: 0 25px 70px #00000030;
}

.album::after {
  content: "";
  position: absolute;
  inset: 9px;
  border: 1px solid #f8d8ed16;
  pointer-events: none;
}

.record {
  position: absolute;
  z-index: -1;
  width: 330px;
  height: 330px;
  right: -135px;
  top: -110px;
  border-radius: 50%;
  opacity: .4;
  background: repeating-radial-gradient(
    circle, transparent 0 10px, #e4b7d32c 11px,
    transparent 12px 18px
  );
}

.album-star {
  color: #edc9e3;
  font-size: 33px;
  margin-bottom: 25px;
}

.album h1 {
  margin: 0;
  color: #fff0f4;
  font-size: clamp(30px, 7vw, 42px);
  font-weight: normal;
  line-height: 1.16;
}

@supports (-webkit-background-clip: text) {
  .album h1 {
    background: linear-gradient(
      110deg, #edc3d9 15%, #fffaf0 35%,
      #c9dbf6 47%, #fffaf5 55%, #edc3d9 75%
    );
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: pearl 2400ms ease both;
  }
}

.album .copy { color: #e3cbd9; margin: 22px 0 0; }

.label {
  margin: 0 0 26px;
  color: var(--muted);
  font: 10px/1.8 system-ui, sans-serif;
  letter-spacing: .18em;
  text-transform: uppercase;
}

.album .label { color: #d2b0c9; }

.album-bottom {
  margin: 28px 0 0;
  color: #c4a5bd;
  font: 9px/1.8 system-ui, sans-serif;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.message {
  margin: 0;
  font-size: clamp(25px, 5.5vw, 37px);
  font-weight: normal;
  line-height: 1.48;
  text-wrap: pretty;
  overflow-wrap: break-word;
}

.message em { color: var(--accent); }

.stage.note .message {
  font-size: clamp(24px, 5.2vw, 34px);
  font-style: italic;
}

.button-wrap {
  position: relative;
  width: fit-content;
  max-width: 100%;
  margin: 25px auto 0;
}

button {
  font: 500 13px/1.5 system-ui, sans-serif;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.primary {
  display: block;
  min-height: 55px;
  max-width: 100%;
  padding: 17px 24px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: var(--accent);
  color: var(--button-ink);
  transition: background-color 900ms ease, transform 180ms ease;
}

.primary:active { transform: scale(.98); }

button:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 5px;
}

button[aria-disabled="true"] { cursor: wait; }

footer {
  margin-top: 26px;
  min-height: 24px;
  color: var(--muted);
  font: 11px/1.9 system-ui, sans-serif;
  text-wrap: balance;
}

/* В финале карта имеет большие области нажатия. */
.memory {
  margin-top: 38px;
  padding-top: 30px;
  border-top: 1px solid #d4c5eb30;
}

.memory h2 {
  margin: 0 0 12px;
  font-size: 25px;
  font-weight: normal;
}

.memory-grid {
  position: relative;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px 3px;
  margin-top: 23px;
  padding: 12px 0;
  background:
    radial-gradient(ellipse at center, #8674b51a, transparent 70%);
}

.memory-star {
  position: relative;
  display: grid;
  place-items: center;
  min-width: 44px;
  min-height: 52px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: var(--line);
  font-size: 23px;
}

.memory-star:nth-child(3n) { color: #f0c4d8; }
.memory-star:nth-child(4n) { color: #b7e0f0; }

.memory-star::before {
  content: "";
  position: absolute;
  width: 1px;
  height: 18px;
  background: currentColor;
  opacity: .22;
  bottom: -12px;
  transform: rotate(20deg);
}

.memory-star:nth-last-child(-n+5)::before { display: none; }

.memory-star:hover, .memory-star:focus-visible {
  background: #d4c5eb14;
}

dialog {
  width: min(90vw, 460px);
  max-height: 85svh;
  padding: 30px 25px;
  border: 1px solid #d4c5eb40;
  border-radius: 16px;
  background: var(--panel);
  color: var(--ink);
  text-align: center;
  box-shadow: 0 25px 100px #00000055;
}

dialog::backdrop { background: #080b17bd; }

dialog .message {
  font-size: clamp(23px, 5vw, 30px);
}

dialog .primary { margin: 26px auto 0; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

@keyframes arrive {
  from { opacity: 0; transform: translateY(9px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes train-light {
  to { transform: translateX(370%); }
}

@keyframes twinkle {
  0%, 100% { opacity: .55; }
  50% { opacity: 1; }
}

@keyframes star-born {
  0% { opacity: 0; transform: scale(.4); }
  40% { opacity: 1; transform: scale(1.6); }
  100% { opacity: .8; transform: scale(1); }
}

@keyframes station-star {
  0% { background: var(--bg); }
  50% { box-shadow: 0 0 20px var(--line); }
  100% {
    background: var(--line);
    transform: scale(.6);
    box-shadow: 0 0 12px var(--line);
  }
}

@keyframes pearl {
  from { background-position: 100% 50%; }
  to { background-position: 0% 50%; }
}

@keyframes sweep {
  0% { opacity: 0; transform: translateX(-35%); }
  45% { opacity: .6; }
  100% { opacity: 0; transform: translateX(35%); }
}

@keyframes resonance {
  0% { opacity: 0; transform: scale(.4); }
  20% { opacity: .3; }
  100% { opacity: 0; transform: scale(3.4); }
}

@keyframes stage-light {
  0% { opacity: 0; transform: rotate(-12deg); }
  35%, 65% { opacity: .5; }
  100% { opacity: 0; transform: rotate(9deg); }
}

@keyframes shooting {
  0% { opacity: 0; transform: translate(0,0) rotate(28deg); }
  25% { opacity: .8; }
  100% { opacity: 0; transform: translate(160px,85px) rotate(28deg); }
}

@media (max-width: 370px) {
  body { padding-left: 17px; padding-right: 17px; }
  .album { padding: 32px 18px; }
  .stage { padding-left: 8px; padding-right: 8px; }
}

body.paused *, body.paused *::before, body.paused *::after {
  animation-play-state: paused !important;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body data-mode="metro" data-scene="night">
<div class="background" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="city" aria-hidden="true">
  <i></i><i></i><i></i><i></i>
</div>

<div class="sky" id="sky" aria-hidden="true">
  <svg viewBox="0 0 100 100" preserveAspectRatio="none">
    <g id="sky-links"></g>
  </svg>
  <div id="sky-stars"></div>
</div>

<div class="effects" id="effects" aria-hidden="true">
  <div class="motif orbit"></div>
  <div class="motif halo"></div>
  <div class="motif facet"></div>

  <svg class="motif flower" viewBox="0 0 300 300"
       fill="none" stroke="currentColor" stroke-width="1">
    <ellipse cx="150" cy="150" rx="43" ry="120"/>
    <ellipse cx="150" cy="150" rx="43" ry="120"
             transform="rotate(60 150 150)"/>
    <ellipse cx="150" cy="150" rx="43" ry="120"
             transform="rotate(120 150 150)"/>
    <circle cx="150" cy="150" r="20"/>
  </svg>

  <div class="motif sun"></div>
  <div class="sweep"></div>
  <div class="resonance"></div>
  <div class="resonance second"></div>
  <div class="beam"></div>
  <div class="beam second"></div>
  <div class="shooting-star"></div>
</div>

<main>
  <p class="brand" id="brand">между станциями · немного света</p>

  <section class="stage" id="stage" aria-label="Личное послание">
    <h1 class="metro-title">Пока город движется,<br>можно немного выдохнуть.</h1>
    <p class="copy">
      Работа на сегодня позади.
      Между станциями и привычными мыслями
      пусть найдётся минута для чего-то хорошего.
    </p>
    <p class="copy muted">Это маленькое путешествие — не по карте метро.</p>

    <div class="route" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </section>

  <div class="button-wrap">
    <button class="primary" type="button" id="button">Куда тогда?</button>
  </div>

  <footer id="footer">без звука · можно открыть прямо здесь</footer>

  <p class="sr-only" id="announcement"
     aria-live="polite" aria-atomic="true"></p>

  <noscript>
    <p>Чтобы продолжить путешествие, включи JavaScript в браузере.</p>
  </noscript>
</main>

<dialog id="memory-dialog" aria-labelledby="memory-title">
  <h2 class="label" id="memory-title">твоя звезда</h2>
  <p class="message" id="memory-text"></p>
  <button class="primary" id="close-dialog" type="button">Вернуться к небу</button>
</dialog>

<script>
const gentle = [
  ["В тебе есть *свет*, который не просит внимания, но делает всё вокруг немного прекраснее.", "gold"],
  ["Ты — как строчка в любимой книге: её знаешь наизусть, но всё равно перечитываешь с улыбкой.", "pink"],
  ["Твоя улыбка — маленькая *весна*, которой не нужно сверяться с календарём.", "gold"],

  ["Тебе не нужен идеальный день, чтобы быть прекрасной его частью.", "gold"],
  ["Есть красота, которую замечают. Твою — уносят с собой в памяти.", "velvet"],

  ["В тебе есть что-то от тихого звёздного вечера: хочется отложить все дела и просто любоваться.", "diamond"]
];

const drums = [
  ["В твоих руках ритм становится не просто счётом, а способом сказать что-то прекрасное *без единого слова*.", "diamond"],
  ["Ты не просто держишь ритм. Ты даёшь музыке *пульс*.", "velvet"],
  ["За каждым движением, которое однажды станет лёгким, стоят твои старания. И ими уже можно гордиться.", "gold"],
  ["Пусть сейчас получается не всё. Это не отменяет ни твоего таланта, ни дороги, которую ты уже прошла.", "pink"],
  ["Иногда *мечта* звучит не как тихое желание, а как четыре удара палочками перед началом.", "violet"],

  ["Тебе очень идёт создавать музыку: превращать движение в звук, а звук — в чьё-то настроение.", "pink"],
  ["Даже самому сложному рисунку можно дать время. Тебе не нужно уметь всё сегодня, чтобы однажды сыграть его свободно.", "diamond"],
  ["Хочется, чтобы однажды ты вышла на сцену, о которой мечтаешь, и подумала: «Как хорошо, что я тогда не остановилась».", "violet"],
  ["У твоей мечты уже есть пульс. Ты сама задаёшь его каждым новым занятием.", "velvet"],
  ["Ты красиво играешь. Не только потому, что попадаешь в ритм, — в этой музыке есть *ты*.", "pink"],
  ["Один трудный день за установкой не определяет, какая ты музыкантка. У твоей истории гораздо больше тактов.", "diamond"]
];

const music = [
  ["Твои глаза красивее, чем обещает название *Diamond Eyes*.", "diamond"],
  ["Если бы у этой нежности был саундтрек, сейчас играла бы *Sextape*.", "violet"],
  ["В тебе есть что-то от *Beauty School*: хочется поставить весь остальной мир на паузу.", "pink"],
  ["*Be Quiet and Drive* — а можно просто помолчать рядом с тобой, и никуда не ехать?", "velvet"],
  ["Если бы *Cherry Waves* были цветом, ими можно было бы нарисовать этот вечер. Но для твоей улыбки всё равно понадобился бы свет.", "velvet"],
  ["Твоя улыбка — любимый неожиданный переход от тяжёлых гитар к чему-то невероятно *нежному*.", "gold"],
  ["Некоторые песни хочется слушать на повторе. А некоторые мгновения с тобой — проживать ещё раз.", "violet"],
  ["В твоём плейлисте — *Deftones*. А в твоих руках — возможность однажды создать чей-то любимый момент в музыке.", "diamond"]
];

const note = {
  id: "note", kind: "note", scene: "velvet",
  text: "Музыкальные отсылки здесь не случайны. Хотелось, чтобы ты узнала в этом маленьком мире что-то *своё*."
};

const catalog = [
  ...gentle.map(([text, scene], i) => ({ id: `g${i}`, kind: "gentle", text, scene })),
  ...drums.map(([text, scene], i) => ({ id: `d${i}`, kind: "drum", text, scene })),
  ...music.map(([text, scene], i) => ({ id: `m${i}`, kind: "music", text, scene })),
  note
];

const byId = new Map(catalog.map(x => [x.id, x]));

const scenes = {
  night: ["ближе к звёздам", "#111827"],
  cover: ["", "#21111e"],
  velvet: ["бархатная ночь", "#21111e"],
  diamond: ["алмазный свет", "#102532"],
  violet: ["фиалковый сон", "#291840"],
  pink: ["розовая плёнка", "#f6dce7"],
  gold: ["золотой час", "#faf0dc"]
};

const stage = document.getElementById("stage");
const button = document.getElementById("button");
const brand = document.getElementById("brand");
const footer = document.getElementById("footer");
const effects = document.getElementById("effects");
const announcement = document.getElementById("announcement");
const themeMeta = document.querySelector('meta[name="theme-color"]');
const dialog = document.getElementById("memory-dialog");
const memoryText = document.getElementById("memory-text");
const memoryTitle = document.getElementById("memory-title");
const motion = window.matchMedia("(prefers-reduced-motion: reduce)");

const storageKey = "little-universe-metro-v6";
let mode = "metro";
let busy = false;
let effectTimer;
let lastMemoryButton = null;

function el(tag, className, text) {
  const node = document.createElement(tag);
  node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function formatted(node, text) {
  node.replaceChildren();
  text.split("*").forEach((part, index) => {
    node.append(index % 2
      ? el("em", "", part)
      : document.createTextNode(part));
  });
}

function plain(text) { return text.replace(/\*/g, ""); }

function shuffle(values) {
  const result = [...values];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function newState(introSeen = false) {
  const g = shuffle(catalog.filter(x => x.kind === "gentle"));
  const d = shuffle(catalog.filter(x => x.kind === "drum"));
  const m = shuffle(catalog.filter(x => x.kind === "music"));
  const first = g.splice(g.findIndex(x => x.scene === "gold"), 1)[0];
  const deck = [first.id];

  // Восемь небольших глав: музыка распределена по всему пути.
  for (let chapter = 0; chapter < 8; chapter++) {
    const block = [];
    for (let j = 0; j < 3 && g.length; j++) block.push(g.pop());
    for (let j = 0; j < (chapter < 4 ? 2 : 1) && d.length; j++) {
      block.push(d.pop());
    }
    deck.push(...shuffle(block).map(x => x.id));
    if (m.length) deck.push(m.pop().id);
  }

  deck.splice(12, 0, note.id);

  return {
    deck, seen: 0, finished: false,
    introSeen, meteorSeen: false
  };
}

function valid(s) {
  return s &&
    Array.isArray(s.deck) &&
    s.deck.length === catalog.length &&
    new Set(s.deck).size === catalog.length &&
    s.deck.every(id => byId.has(id)) &&
    Number.isInteger(s.seen) &&
    s.seen >= 0 && s.seen <= s.deck.length &&
    typeof s.finished === "boolean" &&
    typeof s.introSeen === "boolean" &&
    typeof s.meteorSeen === "boolean" &&
    (!s.finished || s.seen === s.deck.length);
}

let state;
try {
  const saved = JSON.parse(localStorage.getItem(storageKey));
  state = valid(saved) ? saved : newState();
} catch {
  state = newState();
}

function save() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(state));
  } catch {
    // Без хранилища сайт работает, но после закрытия
    // сохранение прогресса не гарантируется.
  }
}
save();

function setMode(value) {
  mode = value;
  document.body.dataset.mode = value;
}

function setScene(value) {
  document.body.dataset.scene = value;
  themeMeta.content = scenes[value][1];
}

/* Восемь авторских созвездий по краям экрана. */
const groups = [
  [[6,8],[15,5],[23,10],[32,6],[40,12],[47,7]],
  [[57,7],[64,12],[73,6],[81,10],[89,5],[96,12]],
  [[4,22],[10,28],[5,35],[11,41],[5,48],[10,54]],
  [[96,23],[90,29],[96,36],[90,42],[96,49],[90,55]],
  [[5,61],[10,66],[4,72],[10,77],[5,83],[13,87]],
  [[95,62],[90,67],[96,73],[90,78],[96,84],[88,88]],
  [[8,94],[19,90],[27,96],[35,91],[42,97],[48,92]],
  [[56,94],[64,89],[72,96],[80,91],[87,97],[96,93]]
];

const starLayer = document.getElementById("sky-stars");
const linkLayer = document.getElementById("sky-links");
const stars = [];
const links = [];
const previous = new Map();

for (let step = 0; step < 6; step++) {
  for (let group = 0; group < groups.length; group++) {
    if (stars.length >= catalog.length) break;

    const [x, y] = groups[group][step];
    const index = stars.length;
    const star = el("span", "star");
    star.style.left = `${x}%`;
    star.style.top = `${y}%`;
    star.style.setProperty("--duration", `${8 + index % 7}s`);
    star.style.setProperty("--delay", `${-(index % 9)}s`);
    star.append(el("i", "star-core"));
    starLayer.append(star);
    stars.push(star);

    if (previous.has(group)) {
      const point = previous.get(group);
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", point.x);
      line.setAttribute("y1", point.y);
      line.setAttribute("x2", x);
      line.setAttribute("y2", y);
      linkLayer.append(line);
      links.push({ element: line, at: index + 1 });
    }
    previous.set(group, { x, y });
  }
}

function updateSky(animateNew = false) {
  stars.forEach((star, i) => {
    const item = byId.get(state.deck[i]);
    star.className = `star ${item.kind}`;
    if (i % 4 === 0) star.classList.add("twinkle");
    if (i < state.seen) star.classList.add("on");

    if (animateNew && i === state.seen - 1 && !motion.matches) {
      star.classList.add("newborn");
    }
  });

  links.forEach(link => {
    link.element.classList.toggle("on", state.seen >= link.at);
  });
}

function renderCover() {
  setMode("cover");
  setScene("cover");
  stage.classList.remove("note", "final", "departing");
  stage.classList.add("cover");
  stage.style.minHeight = "";

  const album = el("div", "album");
  const record = el("div", "record");
  record.setAttribute("aria-hidden", "true");

  const icon = el("div", "album-star", "✧");
  icon.setAttribute("aria-hidden", "true");

  const name = el("h1", "");
  name.append("Василиса", document.createElement("br"), "Романовна");

  album.append(
    record,
    icon,
    el("p", "label", "посвящается тебе"),
    name,
    el("p", "copy",
      "Если бы тёплые слова могли стать альбомом, этот был бы посвящён тебе."),
    el("p", "album-bottom", "мягкость внутри · электричество снаружи")
  );

  stage.replaceChildren(album);
  brand.textContent = "маленькая вселенная · личное издание";

  button.textContent = state.finished
    ? "Вернуться к собранному небу"
    : state.seen > 0
      ? "Продолжить маленькую вселенную"
      : "Открыть маленькую вселенную";

  footer.textContent = state.seen > 0
    ? "твоё небо осталось здесь"
    : "здесь звучат слова, не музыка";

  announcement.textContent = "Василиса Романовна. Этот маленький альбом посвящён тебе.";
  updateSky();
}

function renderCard(isNew) {
  setMode("reading");
  const item = byId.get(state.deck[state.seen - 1]);
  const remaining = state.deck.length - state.seen;
  const scene = remaining < 3 ? "night" : item.scene;

  setScene(scene);
  stage.classList.remove("cover", "final", "departing");
  stage.classList.toggle("note", item.kind === "note");

  const label = item.kind === "note"
    ? "сторона B · между строк"
    : item.kind === "drum"
      ? "твоей мечте есть куда звучать"
      : item.kind === "music"
        ? "маленькая отсылка к твоему плейлисту"
        : scenes[scene][0];

  const message = el("p", "message");
  formatted(message, item.text);

  stage.replaceChildren(
    el("h1", "sr-only", "Тёплые слова"),
    el("p", "label", label),
    message
  );

  brand.textContent = "маленькая вселенная · для тебя";

  button.textContent = remaining === 0
    ? "Посмотреть, что получилось"
    : item.kind === "note"
      ? "Читать дальше"
      : "Ещё немного магии";

  const footnotes = [
    "одна фраза — ещё одна звезда",
    "у нежности нет обязательного повода",
    "мягкость тоже умеет звучать громко",
    "это место никуда не торопится"
  ];

  footer.textContent = remaining === 0
    ? "последняя звезда уже на своём месте"
    : state.seen <= 3
      ? "Если пора выходить — не торопись дочитывать. Твоё небо подождёт."
      : footnotes[Math.floor(state.seen / 4) % footnotes.length];

  announcement.textContent = plain(item.text);
  updateSky(isNew);
  return item;
}

function openMemory(index, source) {
  const item = byId.get(state.deck[index]);
  memoryTitle.textContent = `звезда ${index + 1} · сохранённое послание`;
  formatted(memoryText, item.text);
  lastMemoryButton = source;
  dialog.showModal();
}

function renderFinal() {
  setMode("final");
  setScene("night");
  stage.classList.remove("cover", "note", "departing");
  stage.classList.add("final");
  stage.style.minHeight = "";

  const title = el("h1", "final-title", "Вот и целое небо.");
  const first = el("p", "copy",
    "Пока ты читала, здесь появлялись звёзды. По одной на каждое послание — теперь они все на своём месте.");
  const second = el("p", "copy",
    "На сегодня тёплые слова закончились. Но всё хорошее, что здесь было сказано, не заканчивается вместе с ними.");
  const wish = el("p", "copy",
    "Пусть у тебя будет больше музыки, смелости и моментов, когда ты гордишься собой.");

  const memory = el("section", "memory");
  memory.setAttribute("aria-label", "Карта сохранённых посланий");

  const grid = el("div", "memory-grid");

  state.deck.forEach((id, index) => {
    const item = byId.get(id);
    const symbol = item.kind === "drum" ? "◎"
      : item.kind === "music" || item.kind === "note" ? "✧" : "✦";

    const starButton = el("button", "memory-star", symbol);
    starButton.type = "button";
    starButton.setAttribute("aria-label", `Прочитать послание звезды ${index + 1}`);
    starButton.addEventListener("click", () => openMemory(index, starButton));
    grid.append(starButton);
  });

  memory.append(
    el("h2", "", "Здесь слова остаются."),
    el("p", "copy muted",
      "Коснись любой звезды, чтобы перечитать её послание."),
    grid
  );

  stage.replaceChildren(
    el("p", "label", "последний трек · послесвечение"),
    title, first, second, wish, memory,
    el("p", "copy muted",
      "Если захочешь пройти этот маленький путь ещё раз — нажми кнопку ниже.")
  );

  brand.textContent = "маленькая вселенная · собрана тобой";
  button.textContent = "Собрать небо заново";
  footer.textContent = "у этой истории есть финал. у нежности — нет.";

  announcement.textContent = [
    title.textContent, first.textContent,
    second.textContent, wish.textContent,
    "Ниже можно открывать звёзды и перечитывать послания."
  ].join(" ");

  updateSky();
}

function clearEffects() {
  clearTimeout(effectTimer);
  effects.classList.remove("play", "drum", "spotlight", "shooting");
}

function animateCard(item, isNew) {
  clearEffects();
  if (!isNew) return;

  const firstMeteor = item.kind === "note" && !state.meteorSeen;
  if (firstMeteor) {
    state.meteorSeen = true;
    save();
  }

  if (motion.matches) return;

  void effects.offsetWidth;
  effects.classList.add("play");

  if (item.kind === "drum") effects.classList.add("drum");

  // Только три особенные барабанные фразы получают свет сцены.
  if (["d1", "d6", "d8"].includes(item.id)) {
    effects.classList.add("spotlight");
  }

  if (firstMeteor) effects.classList.add("shooting");

  effectTimer = setTimeout(clearEffects, 4700);
}

document.getElementById("close-dialog").addEventListener("click", () => {
  dialog.close();
});

dialog.addEventListener("close", () => {
  if (lastMemoryButton && lastMemoryButton.isConnected) {
    lastMemoryButton.focus({ preventScroll: true });
  }
});

const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

button.addEventListener("click", async () => {
  if (busy) return;
  busy = true;
  button.setAttribute("aria-disabled", "true");

  try {
    const delay = motion.matches ? 0 : 390;
    const oldMode = mode;

    if (mode === "metro") {
      stage.classList.add("departing");
      await wait(motion.matches ? 0 : 850);

      stage.classList.add("hidden");
      await wait(delay);

      state.introSeen = true;
      renderCover();
      save();

      stage.classList.remove("hidden");
      return;
    }

    if (mode === "reading") {
      stage.style.minHeight = `${stage.getBoundingClientRect().height}px`;
    }

    const toFinal =
      (mode === "reading" && state.seen === state.deck.length) ||
      (mode === "cover" && state.finished);

    stage.classList.add("hidden");
    await wait(delay);
    clearEffects();

    if (toFinal) {
      // Короткая пауза: только собранное небо.
      setScene("night");
      document.body.dataset.mode = "final";
      button.style.visibility = "hidden";
      brand.style.opacity = "0";
      footer.style.opacity = "0";

      await wait(motion.matches ? 0 : 700);

      state.finished = true;
      renderFinal();
      save();
      window.scrollTo({ top: 0, behavior: "auto" });
    } else {
      let isNew = false;

      if (mode === "final") {
        state = newState(true);
        state.seen = 1;
        stage.style.minHeight = "";
        isNew = true;
      } else if (mode === "cover") {
        if (state.seen === 0) {
          state.seen = 1;
          isNew = true;
        }
      } else {
        state.seen++;
        isNew = true;
      }

      const item = renderCard(isNew);
      save();

      stage.style.minHeight = `${stage.getBoundingClientRect().height}px`;
      animateCard(item, isNew);

      if (oldMode === "final") {
        window.scrollTo({ top: 0, behavior: "auto" });
      }
    }

    stage.classList.remove("hidden");
    await wait(delay);
  } finally {
    stage.classList.remove("hidden");
    button.style.visibility = "";
    brand.style.opacity = "";
    footer.style.opacity = "";
    button.removeAttribute("aria-disabled");
    busy = false;
  }
});

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (!busy) stage.style.minHeight = "";
  }, 200);
});

function visibility() {
  document.body.classList.toggle("paused", document.hidden);
}

document.addEventListener("visibilitychange", visibility);
visibility();

if (state.introSeen) renderCover();
else updateSky();
</script>
